<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a0660">
<title>The Trainee Stakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: a purple-party game-show stage. Spinning multicolour sunburst, chasing marquee bulbs,
   a bonus wheel for the big screen and a bright ticket on every phone. Single committed look. */
:root{
  color-scheme: dark;
  --stage:#6a12c9;
  --bar:#2a0660;
  --glow:radial-gradient(circle at 12% 15%,rgba(255,45,149,.6),transparent 42%),radial-gradient(circle at 88% 22%,rgba(255,224,20,.35),transparent 40%),radial-gradient(circle at 50% 110%,rgba(24,224,255,.5),transparent 52%);
  --rays:repeating-conic-gradient(rgba(255,45,149,.3) 0deg 6deg,transparent 6deg 12deg,rgba(255,255,255,.13) 12deg 18deg,transparent 18deg 24deg);
  --panel:#10032e;
  --panel-2:#1c0752;
  --line:rgba(255,255,255,.18);
  --text:#ffffff;
  --muted:#d4c6ff;
  --green:#2dff6e;
  --green-deep:#0f9e3c;
  --yellow:#ffe014;
  --yellow-deep:#b89b00;
  --magenta:#ff2d95;
  --magenta-deep:#a8125c;
  --cyan:#18e0ff;
  --orange:#ff8a1f;
  --red:#ff3355;
  --red-deep:#b0102f;
  --purple:#a35cff;
  --ink:#160933;
  --ink-soft:#5d4f86;
  --ticket:#ffffff;
  --ticket-tint:#f0ebff;
  --ticket-line:rgba(22,9,51,.14);
  --win:#08a34a;
  --lose:#e0245e;
  --up:#2dff6e;
  --down:#ff7aa8;
  --f-display:"Bungee",Impact,"Arial Black",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--stage);
  background-image:var(--glow);
  color:var(--text);font-family:var(--f-body);font-size:15.5px;line-height:1.45;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;z-index:-1;pointer-events:none;
  background:var(--rays);
  animation:rays 22s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
img,svg{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.min0{min-width:0}
h1,h2,h3,p{margin:0}

/* marquee bulbs */
.bulbs{height:9px;background:radial-gradient(circle,var(--green) 2.6px,transparent 3.2px) 0 50%/26px 9px repeat-x,radial-gradient(circle,var(--magenta) 2.6px,transparent 3.2px) 13px 50%/26px 9px repeat-x;animation:chase .32s steps(2) infinite}
.bulbs.alt{background:radial-gradient(circle,var(--yellow) 2.6px,transparent 3.2px) 0 50%/26px 9px repeat-x,radial-gradient(circle,var(--cyan) 2.6px,transparent 3.2px) 13px 50%/26px 9px repeat-x;animation:chase .32s steps(2) infinite}
@keyframes chase{to{background-position:13px 50%,26px 50%}}

/* top bar */
.top{background:var(--bar);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-size:20px;margin-right:auto;min-width:0;line-height:1.15;overflow-wrap:anywhere;
  background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta),var(--cyan),var(--green));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.roomcode{font-family:var(--f-display);color:var(--ink);background:var(--green);font-size:14px;letter-spacing:.08em;border-radius:999px;padding:5px 12px}
.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{background:none;border:0;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--green);color:var(--ink)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--muted)}
.iconbtn[aria-pressed="true"]{border-color:var(--green);color:var(--green)}
main{padding-block:26px 56px}
body.dock-on main{padding-top:min(16px,1.2vh);padding-bottom:150px}
body.dock-on .wrap{max-width:1500px}

/* shared type */
.eyebrow{font-size:12.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.mega{font-family:var(--f-display);font-size:clamp(38px,7.2vw,98px);line-height:.95;color:var(--green);text-shadow:3px 3px 0 var(--magenta),6px 6px 0 var(--cyan);margin:10px 0 20px;text-wrap:balance;overflow-wrap:anywhere}
.lede{font-size:clamp(16px,1.6vw,20px);max-width:62ch;font-weight:700}
.lede b{color:var(--green)}
.muted{color:var(--muted)}

/* contestant tiles */
.cloth{flex:none;width:44px;height:44px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1;border-radius:12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 0 0 2px rgba(255,255,255,.6)}
.cloth.sm{width:34px;height:34px;font-size:17px;border-radius:9px}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:34px;align-items:start}
@media (max-width:880px){.lobby{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.runner{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;animation:bob 1.4s ease-in-out infinite}
.runner:nth-child(2n){animation-delay:-.7s}
@keyframes bob{50%{transform:translateY(-4px)}}
.runner b{font-family:var(--f-display);font-size:19px;overflow-wrap:anywhere;line-height:1.1}
.joined{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:min(24px,1.8vh);padding-top:min(18px,1.4vh);border-top:2px dashed var(--line)}
.joined .metric span{font-size:15px}
.joined .metric b{font-size:clamp(40px,min(5vw,7.5vh),80px)}
.joined .chip{font-size:clamp(15px,min(1.6vw,2.5vh),22px);padding:min(8px,.9vh) 15px}
.mega.lob{font-size:clamp(34px,min(6vw,8vh),92px);margin:6px 0 min(18px,2vh)}
.mega.sm{font-size:clamp(30px,min(5vw,7vh),72px);margin:6px 0 8px}
.steps-big{list-style:none;margin:0;padding:0;display:grid;gap:min(12px,1.4vh);max-width:1000px}
.steps-big li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;font-size:clamp(16px,min(1.9vw,2.9vh),27px);font-weight:800;line-height:1.25}
.steps-big i{font-style:normal;font-family:var(--f-display);width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--ink);font-size:.95em}
.steps-big li:nth-child(2) i{background:var(--magenta);color:var(--text)}
.steps-big li:nth-child(3) i{background:var(--yellow)}
.steps-big li:nth-child(4) i{background:var(--cyan)}
.steps-big li:nth-child(5) i{background:var(--orange)}
.steps-big b{color:var(--yellow)}
.lobby .qrcard{width:min(330px,36vh,100%);padding:14px}
.lobby .qrcard .scan{font-size:clamp(18px,3vh,26px)}
.lobby .qrcard .code{font-size:clamp(24px,4.4vh,36px)}
.runner .cloth{width:clamp(32px,5vh,44px);height:clamp(32px,5vh,44px);font-size:clamp(16px,2.6vh,22px)}
.runner{padding:min(10px,1.1vh) 12px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;min-width:0;flex:1}
.chip{display:inline-flex;gap:8px;align-items:baseline;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:800;max-width:100%;overflow-wrap:anywhere}
.payouts .chip{font-size:clamp(14px,min(1.5vw,2.4vh),20px)}
.chip.off{opacity:.5}
.chip .plus{font-family:var(--f-display);color:var(--green)}
.qrcard{background:var(--ticket);color:var(--ink);border-radius:22px;padding:18px;width:min(340px,100%);text-align:center;border:6px solid var(--green);box-shadow:0 0 0 5px var(--magenta),0 0 0 10px var(--yellow),0 18px 50px rgba(0,0,0,.45);animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.qrcard .qr{display:block;width:100%;height:auto}
.qrcard .scan{font-family:var(--f-display);font-size:26px;color:var(--magenta);line-height:1;margin-bottom:10px}
.qrcard .code{font-family:var(--f-display);font-size:36px;letter-spacing:.12em;margin-top:6px;line-height:1}
.qrcard .small{font-size:12px;font-weight:800;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:.1em}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,2,30,.9);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.overlay .qrcard{width:min(560px,86vmin);animation:none}
.overlay .qrcard .code{font-size:clamp(34px,6vmin,60px)}

/* round board */
.racehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.raceno{font-family:var(--f-display);font-size:clamp(20px,min(2.6vw,4vh),34px);color:var(--cyan);line-height:1}
.raceno small{color:var(--muted);font-size:.6em}
.pill{font-size:12.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;line-height:1;display:inline-block}
.pill.open{background:var(--green);color:var(--ink);animation:pulse .55s ease-in-out infinite}
.pill.shut{background:var(--red);color:var(--text)}
.pill.res{background:var(--yellow);color:var(--ink)}
.pill.mult{background:var(--magenta);color:var(--text);animation:pulse .55s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.statement{font-weight:900;font-size:clamp(30px,min(6.2vw,6.7vh),100px);line-height:1.02;margin:min(12px,1.4vh) 0 min(20px,2.2vh);text-wrap:balance;max-width:26ch;overflow-wrap:anywhere;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.statement.sm{font-size:clamp(26px,min(4.2vw,5.4vh),64px);margin-bottom:min(16px,1.8vh)}
.statement.long{font-size:clamp(28px,min(5vw,6.2vh),80px)}
.statement.sm.long{font-size:clamp(22px,min(3.4vw,4.4vh),52px)}
.tote{background:var(--panel);border:4px solid var(--green);border-radius:20px;padding:2px 20px 8px;box-shadow:0 0 0 4px var(--magenta),0 0 50px rgba(45,255,110,.35)}
.totehead{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;padding:min(12px,1.4vh) 0 min(10px,1.2vh)}
.metric span{display:block;font-size:11.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.metric b{display:inline-block;font-family:var(--f-display);font-weight:400;color:var(--yellow);font-size:clamp(24px,min(3.4vw,5vh),46px);line-height:1;font-variant-numeric:tabular-nums}
.metric.small b{font-size:clamp(18px,min(2.4vw,3.4vh),30px);color:var(--text)}
.bump{animation:bump .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.35);color:var(--green)}100%{transform:scale(1)}}
.toterow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:min(9px,.85vh) 0;border-top:2px dashed var(--line)}
.toterow .cloth{width:clamp(30px,5vh,54px);height:clamp(30px,5vh,54px);font-size:clamp(16px,2.8vh,26px)}
.toterow .line{display:flex;align-items:center;gap:12px;margin-top:4px}
.toterow .nm{font-family:var(--f-display);font-size:clamp(17px,min(2.2vw,3.5vh),32px);line-height:1.1;overflow-wrap:anywhere}
.toterow .sub{font-size:clamp(11px,1.7vh,15px);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{flex:1;min-width:40px;height:clamp(6px,1vh,10px);border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta));border-radius:5px;transition:width .25s ease-out}
.odds{font-family:var(--f-display);color:var(--cyan);font-size:clamp(20px,min(3vw,4.8vh),44px);text-align:right;min-width:3em;font-variant-numeric:tabular-nums;line-height:1}
.toterow.winner{background:var(--green);color:var(--ink);border-radius:14px;padding-inline:12px;margin-inline:-12px;border-top-color:transparent}
.toterow.winner .sub,.toterow.winner .odds{color:var(--ink)}
.toterow.winner .bar{background:rgba(0,0,0,.14)}
.toterow.winner .bar i{background:var(--magenta)}
.toterow.winner + .toterow{border-top-color:transparent}
.toterow.loser{opacity:.35}
@media (min-width:900px){.rows.two{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}}
.wtag{display:inline-block;margin-left:10px;font-family:var(--f-body);font-size:11px;font-weight:900;letter-spacing:.14em;padding:3px 8px;border-radius:999px;background:var(--magenta);color:var(--text);vertical-align:middle;animation:pulse .5s ease-in-out infinite}
.verdict{margin-top:min(18px,2vh);font-size:clamp(16px,min(1.8vw,2.8vh),24px);font-weight:800;max-width:60ch}
.verdict b{color:var(--green)}
.payouts{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.popin .chip{animation:pop .3s cubic-bezier(.2,1.6,.4,1) both}
.popin .chip:nth-child(2){animation-delay:.06s}.popin .chip:nth-child(3){animation-delay:.12s}.popin .chip:nth-child(4){animation-delay:.18s}.popin .chip:nth-child(n+5){animation-delay:.24s}
.flash{animation:flash .5s ease-out 2}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(45,255,110,.95)}100%{box-shadow:0 0 0 26px rgba(45,255,110,0)}}

/* bonus wheel */
.lockgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:min(30px,2.4vw);align-items:start}
@media (max-width:880px){.lockgrid{grid-template-columns:minmax(0,1fr)}}
.wheelbox{position:relative;display:grid;justify-items:center;text-align:center}
.wheel{position:relative;width:100%;max-width:min(680px,max(260px,calc(100vh - 350px)));aspect-ratio:1/1;filter:drop-shadow(0 0 34px rgba(45,255,110,.45))}
.wheel.small{max-width:250px;filter:drop-shadow(0 6px 16px rgba(22,9,51,.35))}
.wheel>svg,.wheel>.wheel-disc{position:absolute;inset:0;width:100%;height:100%}
.wheel-disc{transform-origin:50% 50%;will-change:transform}
.wheel-disc svg{display:block;width:100%;height:100%}
.wheel .rim{fill:var(--panel);stroke:var(--green);stroke-width:4}
.wheel .b0{fill:var(--green);animation:blink .26s steps(2) infinite}
.wheel .b1{fill:var(--magenta);animation:blink .26s steps(2) infinite;animation-delay:.13s}
.wheel .b2{fill:var(--yellow);animation:blink .26s steps(2) infinite;animation-delay:.065s}
@keyframes blink{50%{opacity:.2}}
.wheel .hub{fill:var(--ink);stroke:var(--green);stroke-width:4}
.wheel .hubtxt{font-family:var(--f-display);fill:var(--green);font-size:17px}
.wheel .hubtxt.sm{font-size:12px}
.wheel .pointer{fill:var(--text);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.multi{display:grid;justify-items:center;line-height:1}
.multi b{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,min(6vw,9vh),100px);color:var(--green);text-shadow:4px 4px 0 var(--magenta),8px 8px 0 var(--cyan)}
.multi.jackpot b{background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta),var(--cyan),var(--green));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:shimmer .8s linear infinite;filter:drop-shadow(4px 4px 0 var(--ink))}
.multi span{font-size:14px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);margin-top:6px}
.pop{animation:pop .4s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.wheelcap{font-weight:900;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-size:clamp(14px,2vh,18px)}
.wheelover{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:7%;pointer-events:none}
.wheelover .multi{background:var(--panel);border:4px solid var(--green);border-radius:22px;padding:8px 26px 12px;box-shadow:0 0 0 4px var(--magenta),0 14px 30px rgba(0,0,0,.45)}
.resultgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:min(30px,2.4vw);align-items:start}
.resultcard{min-width:0}
.itwas{display:flex;align-items:center;gap:16px;margin:6px 0 4px}
.itwas .cloth{width:clamp(56px,10vh,96px);height:clamp(56px,10vh,96px);font-size:clamp(28px,5vh,46px);border-radius:20px}
.itwas b{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,min(4.6vw,8vh),84px);line-height:1;overflow-wrap:anywhere}
@media (max-width:880px){.resultgrid{grid-template-columns:minmax(0,1fr)}}
.flashbang{position:fixed;inset:0;pointer-events:none;z-index:65;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(45,255,110,.45) 35%,rgba(255,45,149,.25) 60%,transparent 80%);animation:fb .55s ease-out forwards}
@keyframes fb{from{opacity:1}to{opacity:0}}

/* standings + final */
.ladder{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:14px;background:var(--panel);border-radius:16px;overflow:hidden}
.ladder tr:first-child td{border-top:0}
.ladder td:first-child{padding-left:18px}
.ladder td:last-child{padding-right:18px}
.ladder td{padding:10px 8px;border-top:2px dashed var(--line);vertical-align:middle}
.rk{font-family:var(--f-display);font-size:26px;color:var(--muted);width:2.4em}
.ladder tr.podium .rk{color:var(--green)}
.pn{font-family:var(--f-display);font-size:clamp(18px,2vw,28px);overflow-wrap:anywhere;line-height:1.1}
.pb{font-family:var(--f-display);color:var(--yellow);font-size:clamp(18px,2.2vw,30px);text-align:right;white-space:nowrap}
.pd{text-align:right;font-size:13px;font-weight:800;white-space:nowrap;color:var(--muted);width:6em}
.pd.up{color:var(--up)}
.pd.down{color:var(--down)}
.ladgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),auto);grid-auto-flow:column;column-gap:30px;background:var(--panel);border-radius:18px;padding:6px 20px;margin-top:min(14px,1.6vh);font-size:clamp(13px,calc(var(--avail) / var(--rows) * .4),28px)}
.lrow{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:.6em;align-items:center;padding:.3em 0;border-bottom:2px dashed var(--line);font-variant-numeric:tabular-nums;min-width:0}
.lrow .rk{font-family:var(--f-display);color:var(--muted)}
.lrow.podium .rk{color:var(--green)}
.lrow .pn{font-family:var(--f-display);font-size:.9em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lrow .pd{font-size:.55em;font-weight:800;color:var(--muted);white-space:nowrap}
.lrow .pd.up{color:var(--up)}
.lrow .pd.down{color:var(--down)}
.lrow .pb{font-family:var(--f-display);color:var(--yellow);white-space:nowrap}
@media (max-width:700px){.ladgrid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row;font-size:17px}}
.champ{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.trophy{flex:none;width:clamp(56px,9vh,78px);height:clamp(56px,9vh,78px);border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--ink);font-family:var(--f-display);font-size:38px;box-shadow:0 0 0 5px var(--magenta),0 0 0 10px var(--yellow);animation:pulse .6s ease-in-out infinite}
.bill{display:inline-flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:min(14px,1.6vh);background:var(--yellow);color:var(--ink);border-radius:18px;padding:14px 20px;box-shadow:0 6px 0 var(--yellow-deep);transform:rotate(-1.5deg)}
.bill b{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,min(4vw,6vh),50px);line-height:1}
.bill span{font-weight:900;font-size:clamp(16px,1.8vw,22px)}

/* host dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.dock .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px}
.dock .status{margin-right:auto;font-size:13.5px;font-weight:800;color:var(--muted);min-width:0;flex:1 1 220px}
.dock .status b{color:var(--text)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:900;font-size:14.5px;background:var(--text);color:var(--ink);line-height:1.2;text-decoration:none;display:inline-block}
.btn.primary{background:var(--green);color:var(--ink);box-shadow:0 4px 0 var(--green-deep);animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--green-deep),0 0 24px rgba(45,255,110,.75)}}
.btn.primary:active,.btn.spin:active{transform:translateY(2px)}
.btn.spin{background:linear-gradient(90deg,var(--magenta),var(--orange));color:var(--text);box-shadow:0 4px 0 var(--magenta-deep);animation:shake .9s ease-in-out infinite}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-4deg)}85%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.armed{background:var(--red);color:var(--text)}
.btn:disabled{animation:none}
.kbd{font-size:11.5px;color:var(--muted)}

/* phone ticket */
.slipwrap{max-width:520px;margin:0 auto}
.slipwrap>*{min-width:0}
.slip{position:relative;background:var(--ticket);color:var(--ink);border-radius:22px;padding:28px 18px 22px;overflow:hidden;box-shadow:0 0 0 4px var(--green),0 18px 40px rgba(0,0,0,.45)}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta),var(--cyan),var(--green));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sliphead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px dashed var(--ticket-line);padding-bottom:12px;margin-bottom:16px}
.sliptitle{font-family:var(--f-display);font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.serial{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px;font-variant-numeric:tabular-nums}
.bal{text-align:right;flex:none}
.bal span{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.bal b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;color:var(--magenta);font-variant-numeric:tabular-nums;margin-top:4px}
.q{font-weight:900;font-size:clamp(29px,7.8vw,40px);line-height:1.06;text-wrap:balance;margin:2px 0 6px;overflow-wrap:anywhere}
.label{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 8px}
.picks{display:grid;gap:7px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--ticket-tint);border:3px solid transparent;border-radius:14px;padding:7px 12px 7px 7px;color:var(--ink);transition:transform .08s}
.pick:active{transform:scale(.97)}
.pick .pn2{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere;line-height:1.1}
.pick .po{font-family:var(--f-display);font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--green)}
.pick.fresh{animation:pop .22s cubic-bezier(.2,1.7,.4,1)}
.pick[aria-pressed="true"] .po{color:var(--ink)}
.stake{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stake b{display:inline-block;font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.stake span{font-size:13px;font-weight:800;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;justify-content:space-between}
.coin{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.92),inset 0 0 0 8px currentColor,0 4px 0 rgba(22,9,51,.35);transition:transform .08s}
.coin:active{transform:scale(.88) rotate(-14deg)}
.coin span{color:var(--ink)}
.coin.c10{background:var(--cyan);color:#0b8fb0}
.coin.c50{background:var(--magenta);color:#b31767}
.coin.c100{background:var(--green);color:#0b9a3a}
.coin.c500{background:var(--purple);color:#5a22b8}
.coin.c50 span,.coin.c500 span{color:var(--text)}
.stakebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sbtn{border:0;border-radius:14px;padding:13px 10px;font-weight:900;font-size:15.5px;letter-spacing:.02em;transition:transform .08s}
.sbtn:active{transform:translateY(3px)}
.sbtn.clear{background:var(--red);color:var(--text);box-shadow:0 5px 0 var(--red-deep)}
.sbtn.allin{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--yellow-deep)}
.place{width:100%;margin-top:16px;border:0;border-radius:14px;padding:16px;background:var(--green);color:var(--ink);font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--green-deep);transition:transform .08s}
.place:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-deep)}
.place:disabled{box-shadow:none;background:var(--ticket-tint)}
.note{font-size:13.5px;color:var(--ink-soft);margin-top:12px;font-weight:700}
.note b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--ink);font-weight:800;font-size:13.5px}
.betbox{display:flex;gap:12px;align-items:center;background:var(--ticket-tint);border-radius:14px;padding:10px 12px;margin-top:10px}
.betbox b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.betbox .min0>span{display:block;font-size:13px;font-weight:800;color:var(--ink-soft)}
.stamp{display:inline-block;border:4px solid currentColor;border-radius:12px;padding:6px 14px;font-family:var(--f-display);font-size:26px;letter-spacing:.04em;transform:rotate(-5deg);margin:8px 0 10px;line-height:1.1}
.stamp.win{color:var(--win)}
.stamp.lose{color:var(--lose)}
.stamp.neutral{color:var(--ink-soft)}
.anim{animation:thump .32s cubic-bezier(.2,1.5,.4,1) both}
@keyframes thump{from{transform:rotate(-5deg) scale(1.8);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.mini{display:grid;gap:7px;margin-top:6px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.mrow .mn{font-weight:900;overflow-wrap:anywhere}
.mrow .mv{font-weight:900}
.mrow.me{background:var(--green);border-radius:8px;padding:3px 7px;margin-inline:-7px}
.mbar{height:7px;border-radius:4px;background:var(--ticket-line);margin-top:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--magenta))}
.mrk{font-family:var(--f-display);font-size:18px;width:1.6em;color:var(--ink-soft)}
.wheelslot{display:grid;justify-items:center;gap:8px;margin-top:6px;text-align:center}
.paysx{font-family:var(--f-display);font-size:24px;color:var(--magenta)}
.billcard{margin-top:14px;background:var(--yellow);border-radius:16px;padding:14px 16px;transform:rotate(-1deg)}
.billcard .big{font-family:var(--f-display);font-size:40px;line-height:1}
.billcard .label{margin-top:0;color:var(--ink)}
.billcard p:last-child{font-weight:900;margin-top:6px}
.join-in{width:100%;padding:13px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--ticket-tint);color:var(--ink);font:inherit;font-weight:800;font-size:17px;margin-top:6px}
.join-in:focus{outline:3px solid var(--magenta);outline-offset:1px}
.join-in.code{font-family:var(--f-display);font-size:24px;letter-spacing:.2em;text-transform:uppercase}
pre.rules{background:var(--ticket-tint);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.4;overflow-x:auto;margin:8px 0 0;color:var(--ink)}
ol.steps{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink-soft);display:grid;gap:4px;font-weight:700}
ol.steps b{color:var(--ink)}

/* setup */
.setup{max-width:900px;margin:0 auto;display:grid;gap:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px}
.card h2{font-family:var(--f-display);font-weight:400;color:var(--green);font-size:22px;line-height:1.1}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 14px;max-width:64ch;font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:grid;gap:6px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label.check{display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;margin-bottom:12px}
label.check input{width:22px;height:22px;accent-color:var(--green)}
.inp{width:100%;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;font-weight:700;font-size:15px;letter-spacing:normal;text-transform:none}
.inp:focus{border-color:var(--green);outline:none}
textarea.inp{resize:vertical;min-height:46px;line-height:1.35}
.tlist{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.srow{display:grid;grid-template-columns:2em minmax(0,1fr) minmax(140px,210px) 42px;grid-template-areas:"n t w x";gap:10px;align-items:start;padding:12px 0;border-top:2px dashed var(--line)}
.srow:first-of-type{border-top:0}
.srow .sn{grid-area:n;font-family:var(--f-display);font-size:20px;color:var(--cyan);padding-top:6px}
.srow textarea{grid-area:t}
.srow select{grid-area:w}
.srow .x{grid-area:x}
@media (max-width:620px){.srow{grid-template-columns:2em minmax(0,1fr) 42px;grid-template-areas:"n t x" ". w ."}}
.x{background:none;border:2px solid var(--line);border-radius:10px;width:42px;height:44px;color:var(--muted);font-size:15px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.setup-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
.setup-actions .muted{margin-right:auto;font-size:13.5px;font-weight:700}
.exnote{display:inline-block;background:rgba(255,224,20,.15);color:var(--yellow);border-radius:6px;padding:1px 7px;font-weight:800}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbox code{flex:1 1 240px;min-width:0;overflow-wrap:anywhere;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--muted)}
.warn{color:var(--yellow);font-size:13.5px;font-weight:800;margin-top:10px}
.setup .btn.primary{animation:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:900;font-size:14px;z-index:60;width:max-content;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

@media (max-width:520px){.tote{padding-inline:12px}.toterow{gap:10px}.totehead{gap:20px}.brand{font-size:17px}.coin{width:58px;height:58px}}

/* ---------- switchable looks (purple party is the default above) ---------- */
html[data-look="neon"]{--stage:#17053d;--bar:#10032e;
  --glow:radial-gradient(circle at 12% 18%,rgba(45,255,110,.2),transparent 34%),radial-gradient(circle at 88% 26%,rgba(255,45,149,.22),transparent 36%),radial-gradient(circle at 50% 105%,rgba(24,224,255,.2),transparent 45%);
  --rays:repeating-conic-gradient(rgba(45,255,110,.13) 0deg 6deg,transparent 6deg 12deg,rgba(255,45,149,.13) 12deg 18deg,transparent 18deg 24deg,rgba(255,224,20,.12) 24deg 30deg,transparent 30deg 36deg,rgba(24,224,255,.13) 36deg 42deg,transparent 42deg 48deg)}
html[data-look="burst"]{--stage:#17053d;--bar:#10032e;--glow:none;
  --rays:repeating-conic-gradient(rgba(45,255,110,.55) 0deg 7deg,transparent 7deg 14deg,rgba(255,45,149,.55) 14deg 21deg,transparent 21deg 28deg,rgba(255,224,20,.5) 28deg 35deg,transparent 35deg 42deg,rgba(24,224,255,.55) 42deg 49deg,transparent 49deg 56deg)}
html[data-look="burst"] :is(.statement,.lede,.raceno,.eyebrow,.verdict,.steps-big li,.itwas b,.joined .metric span,.joined .metric b){text-shadow:0 2px 0 #160933,0 0 14px #160933,0 0 28px #160933}
html[data-look="orange"]{--stage:#d04a02;--bar:#2b1205;--panel:#2b1205;--panel-2:#3d1a07;--green:#ffb600;--green-deep:#a87800;--magenta:#db536a;--magenta-deep:#8f2c3d;--cyan:#ffe9b8;--orange:#eb8c00;--muted:#ffd6bf;--up:#ffb600;
  --glow:radial-gradient(circle at 12% 15%,rgba(255,182,0,.55),transparent 42%),radial-gradient(circle at 88% 22%,rgba(219,83,106,.55),transparent 40%),radial-gradient(circle at 50% 110%,rgba(235,140,0,.65),transparent 52%);
  --rays:repeating-conic-gradient(rgba(255,255,255,.14) 0deg 6deg,transparent 6deg 12deg,rgba(255,182,0,.24) 12deg 18deg,transparent 18deg 24deg)}
html[data-look="orange"] .mega{color:#ffffff;text-shadow:3px 3px 0 #db536a,6px 6px 0 #2b1205}
html[data-look="orange"] .multi:not(.jackpot) b{color:#ffffff;text-shadow:4px 4px 0 #db536a,8px 8px 0 #2b1205}
html[data-look="orange"] .multi.jackpot b{filter:drop-shadow(4px 4px 0 #2b1205)}
html[data-look="orange"] :is(.multi span,.eyebrow,.raceno){color:#ffffff}
html[data-look="orange"] .raceno small{color:#ffe9b8}
html[data-look="orange"] :is(.lede b,.verdict b,.steps-big b){color:#2b1205}
html[data-look="orange"] .statement{text-shadow:0 3px 0 rgba(43,18,5,.45)}
html[data-look="orange"] .qrcard{box-shadow:0 0 0 5px #db536a,0 0 0 10px #2b1205,0 18px 50px rgba(0,0,0,.35)}
html[data-look="orange"] .coin.c100{color:#a87800}
html[data-look="green"]{--stage:#1fe060;--bar:#10032e;
  --glow:radial-gradient(circle at 12% 15%,rgba(255,224,20,.6),transparent 42%),radial-gradient(circle at 88% 22%,rgba(24,224,255,.45),transparent 40%),radial-gradient(circle at 50% 110%,rgba(255,255,255,.4),transparent 52%);
  --rays:repeating-conic-gradient(rgba(255,255,255,.24) 0deg 6deg,transparent 6deg 12deg,rgba(255,224,20,.28) 12deg 18deg,transparent 18deg 24deg)}
html[data-look="green"] :is(.statement,.lede,.raceno,.raceno small,.eyebrow,.verdict,.steps-big li,.itwas b,.joined .metric span,.joined .metric b,.joined .muted,.setup-actions .muted,main>.wrap>section>.muted){color:#160933;text-shadow:none}
html[data-look="green"] :is(.lede b,.verdict b,.steps-big b){color:#a8125c}
html[data-look="green"] .mega{color:#ffffff;text-shadow:3px 3px 0 #ff2d95,6px 6px 0 #160933}
html[data-look="green"] .multi:not(.jackpot) b{color:#ffffff;text-shadow:4px 4px 0 #ff2d95,8px 8px 0 #160933}
html[data-look="green"] .multi.jackpot b{filter:drop-shadow(4px 4px 0 #160933)}
html[data-look="green"] .multi span{color:#160933}
html[data-look="green"] .joined{border-top-color:rgba(22,9,51,.3)}
html[data-look="green"] .tote{border-color:#ffe014;box-shadow:0 0 0 4px #ff2d95,0 14px 40px rgba(0,0,0,.35)}
html[data-look="green"] .wheel{filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
html[data-look="green"] :is(.wheel .rim,.wheel .hub){stroke:#ffe014}
html[data-look="green"] .wheel .b0{fill:#ffe014}
html[data-look="green"] .qrcard{border-color:#ffe014;box-shadow:0 0 0 5px #ff2d95,0 0 0 10px #160933,0 18px 50px rgba(0,0,0,.35)}
html[data-look="green"] .slip{box-shadow:0 0 0 4px #160933,0 18px 40px rgba(0,0,0,.35)}
html[data-look="green"] .roomcode{background:#160933;color:#2dff6e}
.looks{display:flex;flex-wrap:wrap;gap:8px}
.lookbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:999px;padding:7px 14px 7px 8px;font-weight:800;font-size:14px}
.lookbtn[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.lookbtn i{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}

/* ---------- compact phone ticket (players) ---------- */
body.player .top .wrap{padding-block:6px}
body.player .brand{font-size:15px}
body.player .roomcode{font-size:12px;padding:3px 10px}
body.player .bulbs{height:7px}
body.player main{padding-block:10px 20px}
body.player .slip{padding:17px 14px 14px;border-radius:18px}
body.player .slip::before{height:7px}
.tickhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px dashed var(--ticket-line)}
.tickhead .who{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--f-display);font-size:17px}
.tickhead .who span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tickhead .rk2{flex:none;font-family:var(--f-body);font-size:11px;font-weight:900;background:var(--ink);color:var(--text);border-radius:999px;padding:2px 8px}
.tickhead .bal2{font-family:var(--f-display);color:var(--magenta);font-size:20px;white-space:nowrap;line-height:1}
.tickhead .bal2 small{font-family:var(--f-body);font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--ink-soft);margin-right:6px;text-transform:uppercase}
.rlabel{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 3px}
.q.bet{font-size:clamp(21px,min(6.4vw,3.8vh),30px);margin:0 0 10px;line-height:1.1}
.picks.grid2{grid-template-columns:1fr 1fr;gap:6px}
.picks.grid2 .pick{grid-template-columns:auto minmax(0,1fr);gap:8px;padding:5px 8px 5px 5px;min-height:clamp(44px,6.6vh,58px);border-width:2.5px}
.picks.grid2 .pick:last-child:nth-child(odd){grid-column:1/-1}
.picks.grid2 .pick .pn2{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picks.grid2 .pick .po{display:block;font-size:12px;margin-top:2px}
.stakerow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
.stakerow b{display:inline-block;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.6vh,38px);line-height:1;font-variant-numeric:tabular-nums}
.stakerow span{font-size:12.5px;font-weight:800;color:var(--ink-soft);text-align:right}
body.player .chips{margin-top:8px}
body.player .coin{width:clamp(48px,7vh,58px);height:clamp(48px,7vh,58px);font-size:12px}
body.player .stakebtns{margin-top:8px;gap:8px}
body.player .sbtn{padding:clamp(8px,1.4vh,12px) 10px;font-size:15px}
body.player .place{margin-top:10px;padding:clamp(11px,1.9vh,15px)}
.betstatus{font-size:13px;font-weight:800;color:var(--ink-soft);margin-top:8px;text-align:center}
.betstatus b{color:var(--win)}
@media (prefers-reduced-motion:reduce){

function actx(){
  try{
    if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C()}
    if(SND.ctx.state==="suspended")SND.ctx.resume();
    return SND.ctx;
  }catch(e){return null}
}
function tone(f,dur,type,vol,when){
  if(!SND.on||S.mode!=="host")return;const c=actx();if(!c)return;
  const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
const sfx={
  tick:()=>tone(2400,.025,"square",.05),
  coin:()=>{tone(988,.07,"square",.07);tone(1319,.16,"square",.07,.06)},
  open:()=>[523,659,784].forEach((f,i)=>tone(f,.12,"square",.07,i*.05)),
  close:()=>{tone(330,.12,"sawtooth",.08);tone(220,.2,"sawtooth",.08,.1)},
  land:m=>{
    const seq=m>=10?[523,659,784,1047,1319,1568,2093]:m>=3?[523,659,784,1047]:m>=2?[523,784,1047]:[392,330];
    seq.forEach((f,i)=>tone(f,.16,"triangle",.16,i*.07));
    if(m>=10)for(let i=0;i<10;i++)tone(1568+((i%3)*262),.08,"square",.05,.5+i*.05);
  },
  reveal:()=>{for(let i=0;i<8;i++)tone(180+i*20,.05,"triangle",.07,i*.04);[523,659,784,1047].forEach((f,i)=>tone(f,.22,"sawtooth",.07,.34+i*.06))},
  fanfare:()=>[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,"triangle",.15,i*.12))
};

/* ---------- money and payouts (parimutuel + bonus wheel) ---------- */
function fmt(n){const c=(S.game&&S.game.cur)||"€";return c+Math.round(Math.abs(n)).toLocaleString("en-US")}
function signed(n){return (n<0?"−":"+")+fmt(n)}
/* Pot = house money + every stake. Winners split the pot by stake, times the wheel's multiplier. */
function settle(r,seed){
  const bets=r.bets||{},m=r.mult||1;let pot=seed||0,win=0;
  for(const b of Object.values(bets)){pot+=b.a;if(b.t===r.answer)win+=b.a}
  const nets={};
  for(const [k,b] of Object.entries(bets))nets[k]=(win>0&&b.t===r.answer)?Math.floor(b.a*pot/win*m)-b.a:-b.a;
  return {pot,win,nets,m};
}
function rounds(g){const r=g.rounds;return Array.isArray(r)?r:r?Object.values(r):[]}
function trainees(g){const t=g&&g.trainees;return Array.isArray(t)?t:t?Object.values(t):[]}
function balances(g){
  const bal={};
  for(const r of rounds(g)){const {nets}=settle(r,g.seed);for(const [k,n] of Object.entries(nets))bal[k]=(k in bal?bal[k]:g.start)+n}
  return bal;
}
function balOf(bal,k){return k in bal?bal[k]:S.game.start}
function book(bets){
  const by={};let total=(S.game&&S.game.seed)||0,stakes=0,count=0;
  for(const b of Object.values(bets)){by[b.t]=(by[b.t]||0)+b.a;total+=b.a;stakes+=b.a;count++}
  return {by,total,stakes,count};
}
function oddsText(total,stake){if(!stake)return "—";const o=total/stake;return (o>=10?Math.round(o):o.toFixed(1))+"×"}

/* ---------- people ---------- */
const myKey=()=>S.me.pid;
function nickOf(k){const p=S.players[k];return (p&&cleanNick(p.nick))||"Player"}
function rosterList(){return Object.entries(S.players||{}).filter(([,p])=>p&&cleanNick(p.nick)).map(([k,p])=>({k,nick:cleanNick(p.nick),on:!!p.online}))}
const onlineCount=()=>rosterList().filter(p=>p.on).length;
const trainee=id=>trainees(S.game).find(t=>t.id===id);
function cloth(t,sm){const c=SADDLE[(t.no-1)%SADDLE.length];return `<span class="cloth${sm?" sm":""}" style="background:${c[0]};color:${c[1]}" aria-hidden="true">${t.no}</span>`}
function cleanBets(raw,g){
  const bal=balances(g),ids=new Set(trainees(g).map(t=>t.id)),out={};
  for(const [k,b] of Object.entries(raw||{})){
    if(!b||!ids.has(b.t))continue;
    const a=Math.min(Math.floor(Number(b.a)),balOf(bal,k));
    if(a>0)out[k]={t:b.t,a};
  }
  return out;
}
function liveBets(){
  const g=S.game,r=g&&g.round;if(!r)return {};
  if(g.phase==="betting")return S.betsKey===r.k?cleanBets(S.bets,g):{};
  return r.bets||{};
}
function standings(){
  const g=S.game,bal=balances(g),keys=new Set(rosterList().map(p=>p.k));
  for(const r of rounds(g))for(const k of Object.keys(r.bets||{}))keys.add(k);
  const rs=rounds(g),last=rs.length?settle(rs[rs.length-1],g.seed).nets:{};
  return [...keys].map(k=>({k,nick:nickOf(k),bal:balOf(bal,k),d:last[k]||0})).sort((a,b)=>b.bal-a.bal||a.nick.localeCompare(b.nick));
}
function rankAt(st,i){let j=i;while(j>0&&st[j-1].bal===st[i].bal)j--;return j+1}
function champions(st){return st.length?st.filter(p=>p.bal===st[0].bal):[]}
function namesList(ps){const n=ps.map(p=>esc(p.nick));return n.length<2?n.join(""):n.slice(0,-1).join(", ")+" & "+n[n.length-1]}

/* ---------- bonus wheel ---------- */
function noteSpin(prev,next){
  const s=next&&next.round&&next.round.spin;if(!s||s.id in S.spinStart)return;
  const prevSpin=prev&&prev.round&&prev.round.k===next.round.k?prev.round.spin:null;
  const live=prev!==undefined&&!prevSpin&&!REDUCED;
  S.spinStart[s.id]=live?Date.now():0;
  const m=next.round.mult||WHEEL[s.seg]||1;
  const landed=()=>{
    if(m>=5)S.fx.add("flash");
    if(m>=10)S.fx.add("confetti");
    sfx.land(m);if(S.mode==="player")buzz(m>=5?[60,40,60,40,160]:40);
    render();
  };
  if(live)setTimeout(landed,SPIN_MS+60);
}
function spinInfo(r){
  const s=r&&r.spin;if(!s)return null;
  const st=S.spinStart[s.id]||0,el=st?Math.min(Date.now()-st,SPIN_MS):SPIN_MS;
  const seg=((s.seg%WHEEL.length)+WHEEL.length)%WHEEL.length,step=360/WHEEL.length;
  const jit=((h32(s.id)%1000)/1000-.5)*step*.6;
  return {to:360*TURNS+360-(seg*step+step/2)+jit,elapsed:el,done:el>=SPIN_MS,mult:r.mult||WHEEL[seg]};
}
function wheelHTML(r,size){
  const si=spinInfo(r),n=WHEEL.length,R=100,step=360/n;let segs="",bulbs="";
  for(let i=0;i<n;i++){
    const a0=(i*step-90)*Math.PI/180,a1=((i+1)*step-90)*Math.PI/180,[bg,fg]=WCOL[WHEEL[i]];
    segs+=`<path d="M0 0L${(R*Math.cos(a0)).toFixed(2)} ${(R*Math.sin(a0)).toFixed(2)}A${R} ${R} 0 0 1 ${(R*Math.cos(a1)).toFixed(2)} ${(R*Math.sin(a1)).toFixed(2)}Z" fill="${bg}" stroke="#160933" stroke-width="1.4"/><text transform="rotate(${((i+.5)*step).toFixed(2)}) translate(0 -70) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-family="Bungee,Impact,sans-serif" font-size="15" fill="${fg}">${WHEEL[i]}×</text>`;
  }
  for(let i=0;i<30;i++){const a=(i*12-90)*Math.PI/180;bulbs+=`<circle cx="${(110*Math.cos(a)).toFixed(1)}" cy="${(110*Math.sin(a)).toFixed(1)}" r="3.6" class="b${i%3}"/>`}
  const hub=si?(si.done?`${si.mult}×`:"?"):"SPIN";
  const disc=si?`<div class="wheel-disc" data-spin="1" data-to="${si.to.toFixed(2)}" data-el="${si.elapsed}" style="transform:rotate(${si.done?si.to.toFixed(2):0}deg)">`:`<div class="wheel-disc">`;
  return `<div class="wheel ${size||""}" role="img" aria-label="Bonus wheel${si&&si.done?`, landed on ${si.mult} times`:""}">
    <svg viewBox="-125 -125 250 250" aria-hidden="true"><circle r="120" class="rim"/>${bulbs}</svg>
    ${disc}<svg viewBox="-125 -125 250 250" aria-hidden="true"><defs><linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset=".35" stop-color="#ffe014"/><stop offset=".65" stop-color="#2dff6e"/><stop offset="1" stop-color="#18e0ff"/></linearGradient></defs>${segs}<circle r="100" fill="none" stroke="#160933" stroke-width="3"/></svg></div>
    <svg viewBox="-125 -125 250 250" aria-hidden="true"><circle r="25" class="hub"/><text class="hubtxt${hub==="SPIN"?" sm":""}" text-anchor="middle" dominant-baseline="central">${hub}</text><path d="M-12 -124L12 -124L0 -97Z" class="pointer"/></svg>
  </div>`;
}
function animateWheels(){
  document.querySelectorAll(".wheel-disc[data-spin]").forEach(el=>{
    const to=Number(el.dataset.to),elapsed=Number(el.dataset.el);
    if(elapsed>=SPIN_MS||!el.animate){el.style.transform=`rotate(${to}deg)`;return}
    const anim=el.animate([{transform:"rotate(0deg)"},{transform:`rotate(${to}deg)`}],{duration:SPIN_MS,delay:-elapsed,easing:"cubic-bezier(.05,.8,.25,1)",fill:"forwards"});
    if(S.mode==="host"&&SND.on)tickLoop(el,anim);
  });
}
/* Click as each segment passes the pointer */
function tickLoop(el,anim){
  const step=360/WHEEL.length;let last=null,lastT=0;
  (function f(){
    if(!el.isConnected||anim.playState!=="running")return;
    const m=/matrix\(([^,]+),\s*([^,]+)/.exec(getComputedStyle(el).transform||"");
    if(m){
      const a=((Math.atan2(+m[2],+m[1])*180/Math.PI)%360+360)%360,seg=Math.floor(a/step);
      if(last!==null&&seg!==last){const now=performance.now();if(now-lastT>26){sfx.tick();lastT=now}}
      last=seg;
    }
    requestAnimationFrame(f);
  })();
}

/* ---------- confetti + flash ---------- */
function confetti(){
  if(REDUCED)return;
  const c=document.createElement("canvas");c.className="confetti";c.setAttribute("aria-hidden","true");document.body.appendChild(c);
  const dpr=window.devicePixelRatio||1,ctx=c.getContext("2d"),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;
  const cols=["#2dff6e","#ff2d95","#ffe014","#18e0ff","#ff8a1f","#a35cff","#ffffff"];
  const P=Array.from({length:220},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*16*dpr,vy:-(8+Math.random()*12)*dpr,s:(5+Math.random()*8)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.35*dpr;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}
    if(t-t0<3200)requestAnimationFrame(f);else c.remove()})(t0);
}
function flashbang(){if(REDUCED)return;const d=document.createElement("div");d.className="flashbang";d.setAttribute("aria-hidden","true");document.body.appendChild(d);setTimeout(()=>d.remove(),650)}
function fxOnce(id,kind){if(!S.seen.has(id)){S.seen.add(id);S.fx.add(kind||"confetti")}}

/* ---------- QR ---------- */
function qrSVG(text){
  try{
    const q=qrcode(0,"M");q.addData(text);q.make();
    const n=q.getModuleCount(),m=4,s=n+2*m;let d="";
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x+m} ${y+m}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" role="img" aria-label="QR code to join the game"><rect width="${s}" height="${s}" fill="#ffffff"/><path d="${d}" fill="#000000"/></svg>`;
  }catch(e){return ""}
}
function qrCard(){
  const code=S.game&&S.code;if(!code)return "";
  return `<div class="qrcard"><div class="scan">Scan to play</div>${qrSVG(joinURL(code))}<div class="small">Room code</div><div class="code">${esc(code)}</div></div>`;
}

/* ---------- writes ---------- */
function errMsg(e){
  const c=e&&e.code;
  if(c==="norun")return "The answers for this game are missing. Open Setup and restart the game.";
  if(c==="timeout")return "The database didn't answer. Check the connection and try again.";
  if(isPerm(e))return "The database refused the change. Check the rules in your Firebase console.";
  return "Couldn't save that. Try again in a moment.";
}
function queue(fn){const p=S.wq.then(fn);S.wq=p.catch(()=>{});return p}
const gpath=p=>`games/${S.code}/${p}`;
const hpath=p=>p?`hosts/${S.hostKey}/${p}`:`hosts/${S.hostKey}`;
async function setGame(next){next.updated=Date.now();await withTimeout(FB.set(gpath("state"),clone(next)),12000)}
async function run(fn){
  if(S.busy)return;S.busy=true;renderChrome(screenKey());
  try{await queue(fn)}catch(e){toast(errMsg(e))}
  finally{S.busy=false;render()}
}
function runOk(){const r=S.host&&S.host.run;return !!(r&&S.game&&r.gid===S.game.gid)}
function runStatements(){const s=S.host.run.statements;return Array.isArray(s)?s:Object.values(s||{})}

async function newCode(){
  for(let i=0;i<8;i++){
    const c=randStr(4,"ABCDEFGHJKLMNPQRSTUVWXYZ23456789");
    const ex=await withTimeout(FB.get(`games/${c}/state`),12000);
    if(!ex)return c;
  }
  return randStr(6,"ABCDEFGHJKLMNPQRSTUVWXYZ23456789");
}
async function startGame(){
  const sd=normalizeSetup(clone(S.host.setup)),gid=rid().slice(0,6);
  if(!S.code){S.code=await newCode();await withTimeout(FB.update(hpath(""),{code:S.code}),12000);subscribeGame()}
  const statements=sd.statements.map(s=>({text:s.text,answer:s.answer}));
  await withTimeout(FB.update(hpath(""),{run:{gid,statements}}),12000);
  S.host=Object.assign({},S.host,{run:{gid,statements}});
  await FB.remove(gpath("bets")).catch(()=>{});
  await setGame({title:sd.title,cur:sd.cur,start:sd.start,seed:sd.seed,wheel:sd.wheel,payer:sd.payer,theme:sd.theme,
    trainees:sd.trainees.map((t,i)=>({id:t.id,name:t.name,no:i+1})),
    total:sd.statements.length,gid,idx:-1,phase:"lobby"});
  S.view="board";
}
async function openRace(i){
  if(!runOk())throw {code:"norun"};
  const g=clone(S.game);g.idx=i;g.phase="betting";g.round={k:g.gid+"-"+i,n:i,text:runStatements()[i].text};
  await setGame(g);
}
async function closeBetting(){
  const g=clone(S.game);
  const raw=await withTimeout(FB.get(gpath("bets/"+g.round.k)),12000);
  g.round.bets=cleanBets(raw,S.game);g.phase="locked";
  await setGame(g);
}
async function spinWheel(){
  const g=clone(S.game);if(g.phase!=="locked"||g.round.spin)return;
  const seg=randInt(WHEEL.length);g.round.spin={seg,id:rid()};g.round.mult=WHEEL[seg];
  await setGame(g);
}
async function reopen(){const g=clone(S.game);delete g.round.bets;delete g.round.spin;delete g.round.mult;g.phase="betting";await setGame(g)}
async function reveal(){
  if(!runOk())throw {code:"norun"};
  const g=clone(S.game);g.round.answer=runStatements()[g.idx].answer;
  g.rounds=rounds(g).concat([g.round]);g.phase="revealed";await setGame(g);
}
async function showStandings(){const g=clone(S.game);g.phase="standings";await setGame(g)}
async function nextRace(){
  const g=S.game;if(g.idx+1<g.total)return openRace(g.idx+1);
  const n=clone(g);n.phase="final";await setGame(n);
}
async function clearPlayers(){await withTimeout(FB.remove(gpath("players")),12000)}

/* ---------- player writes ---------- */
function registerMe(){
  if(S.mode!=="player"||!FB||!S.me.nick||!S.code)return;
  const p=gpath("players/"+S.me.pid);
  FB.onDisconnectUpdate(p,{online:false}).catch(()=>{});
  const cur=S.players[S.me.pid];
  FB.update(p,{nick:S.me.nick,online:true,j:(cur&&cur.j)||Date.now()}).catch(()=>{});
}
async function placeBet(){
  const r=S.game&&S.game.round;if(!r||S.game.phase!=="betting"||!S.pickT||S.stake<=0)return;
  try{await withTimeout(FB.set(gpath(`bets/${r.k}/${S.me.pid}`),{t:S.pickT,a:S.stake,at:Date.now()}),12000);buzz([20,30,40]);toast("Bet placed! You can change it until betting closes.")}
  catch(e){toast(errMsg(e))}
}
async function withdrawBet(){
  const r=S.game&&S.game.round;if(!r)return;
  try{await withTimeout(FB.remove(gpath(`bets/${r.k}/${S.me.pid}`)),12000);toast("Bet withdrawn")}catch(e){toast(errMsg(e))}
}

/* ---------- subscriptions ---------- */
function onDbError(e){S.problem=isPerm(e)?"rules":"unreachable";render()}
function hostCues(prev,next){
  if(S.mode!=="host"||!prev||!next||prev.phase===next.phase)return;
  if(next.phase==="betting")sfx.open();
  else if(next.phase==="locked")sfx.close();
  else if(next.phase==="revealed"){sfx.reveal();S.fx.add("flash")}
  else if(next.phase==="final")sfx.fanfare();
}
function subscribeGame(){
  if(!S.code||S.gameSub===S.code)return;
  S.gameSub=S.code;
  const t=setTimeout(()=>{if(S.game===undefined){S.stale=true;render()}},10000);
  FB.on(gpath("state"),v=>{
    clearTimeout(t);S.stale=false;
    const prev=S.game;S.game=v||null;noteSpin(prev,S.game);hostCues(prev,S.game);
    const rk=S.game&&S.game.phase==="betting"&&S.game.round?S.game.round.k:null;
    if(rk!==S.betsKey){
      if(S.unsub.bets)S.unsub.bets();S.unsub.bets=null;S.bets={};S.betsKey=rk;S.betCount=0;
      if(rk)S.unsub.bets=FB.on(gpath("bets/"+rk),b=>{
        if(S.betsKey!==rk)return;S.bets=b||{};
        const n=Object.keys(S.bets).length;if(n>S.betCount)sfx.coin();S.betCount=n;
        render();
      },onDbError);
    }
    if(S.view===null)S.view=S.mode==="host"?(S.game?"board":"setup"):"play";
    render();
  },e=>{clearTimeout(t);onDbError(e)});
  FB.on(gpath("players"),v=>{
    S.players=v||{};
    if(S.mode==="player"&&S.me.nick&&!S.players[S.me.pid]&&Date.now()-S.rereg>5000){S.rereg=Date.now();registerMe()}
    render();
  },onDbError);
}

/* ---------- toast + confirm + copy ---------- */
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(S.toastT);S.toastT=setTimeout(()=>{t.hidden=true},3600)}
function armed(name){
  if(S.confirm===name){S.confirm=null;clearTimeout(S.confirmT);return true}
  S.confirm=name;clearTimeout(S.confirmT);
  S.confirmT=setTimeout(()=>{S.confirm=null;S.lastKey=null;render()},4000);
  S.lastKey=null;render();return false;
}
function copyText(text,okMsg){
  const done=()=>toast(okMsg||"Copied");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();ok?done():toast("Couldn't copy. Select the text and copy it yourself.")};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);else fallback();
}

/* ---------- screens ---------- */
function screenKey(){
  if(S.problem)return "problem-"+S.problem;
  if(S.mode==="landing")return "landing";
  if(S.mode==="host"){
    if(S.host===undefined)return "boot";
    if(S.view==="setup"||(!S.code&&S.view!=="board"))return "setup";
    if(S.code&&S.game===undefined)return "boot";
    return "board";
  }
  if(!S.code)return "landing";
  if(S.game===undefined)return "boot";
  if(!S.me.nick)return "join";
  return "slip";
}
const STATIC=new Set(["setup","join","landing"]);

function render(){
  const key=screenKey();
  applyLook(key);
  renderChrome(key);
  if(STATIC.has(key)&&key===S.lastKey)return;
  const first=key!==S.lastKey;S.lastKey=key;
  if(key==="setup"&&!S.draft)S.draft=S.host&&S.host.setup?normalizeSetup(clone(S.host.setup)):defaultDraft();
  $("#main").innerHTML=build(key);
  animateWheels();
  if(S.fx.has("flash"))flashbang();
  if(S.fx.has("confetti"))confetti();
  S.fx.clear();
  if(first&&key==="join"){const n=$("#nick");if(n)n.focus({preventScroll:true})}
}
function build(key){
  switch(key){
    case "problem-rules":return rulesCard();
    case "problem-unreachable":return msgCard("Can't reach the game database","Check your internet connection and reload the page. If you're on a company network, try mobile data.");
    case "boot":return msgCard("Warming up the stage…",S.stale?"This is taking longer than usual. Check your connection; the board appears as soon as it loads.":"The live board loads in a moment.");
    case "landing":return landingHTML();
    case "setup":return setupHTML();
    case "board":return boardHTML();
    case "join":return joinHTML();
    case "slip":return slipHTML();
  }
  return "";
}
function msgCard(title,body,extra){return `<div class="slipwrap"><div class="slip"><div class="sliptitle">${esc((S.game&&S.game.title)||"The Trainee Stakes")}</div><p class="q" style="margin-top:12px">${esc(title)}</p><p class="note">${esc(body)}</p>${extra||""}</div></div>`}
function rulesCard(){
  return `<div class="slipwrap"><div class="slip"><div class="sliptitle">Database rules needed</div>

function renderChrome(key){
  const g=S.game,title=(g&&g.title)||"The Trainee Stakes";
  let right="";
  if(S.mode==="host"&&!["boot","problem-rules","problem-unreachable"].includes(key)){
    const v=key==="board"?"board":"setup";
    right=`<div class="tabs" role="group" aria-label="Host views">
      <button class="tab" data-act="view" data-v="board" aria-pressed="${v==="board"}"${S.code?"":" disabled"}>Board</button>

      ${v==="board"?`<button class="iconbtn" data-act="sound" aria-pressed="${SND.on}">${SND.on?"Sound on":"Sound off"}</button><button class="iconbtn" data-act="fs">Full screen</button>`:""}`;
  }else if(S.mode==="player"&&S.code){
    right=`<span class="roomcode" aria-label="Room code">${esc(S.code)}</span>`;
  }
  $("#topbar").innerHTML=`<div class="brand">${esc(title)}</div>${right}`;

/* ---------- host: board ---------- */
function boardHTML(){
  const g=S.game;
  if(!g)return msgCard("No game running","Open Setup and start the game. Players who scan the QR code will see a waiting ticket until then.",`<button class="place" data-act="view" data-v="setup">Go to setup</button>`);
  if(g.phase==="lobby")return boardLobby(g);
  if(g.phase==="standings")return boardStandings(g,false);
  if(g.phase==="final")return boardStandings(g,true);
  return boardRace(g);
}
function boardLobby(g){
  const roster=rosterList(),ts=trainees(g);
  const steps=[
    `<b>Scan the QR code</b> and pick a nickname.`,
    `Each round shows <b>a statement about one trainee</b>.`,
    `<b>Bet play money</b> on who it's about. Everyone starts with <b>${fmt(g.start)}</b>.`,
    `Guessed right? <b>Share the pot</b> with the other winners. The fewer winners, the bigger your share.`,
    g.wheel?`The <b>bonus wheel</b> can multiply your winnings up to <b>20×</b>. Most money at the end wins!`:`<b>Most money</b> at the end wins!`
  ];
  return `<section class="lobby"><div class="min0">
    <p class="eyebrow">Today's lineup</p>
    <h1 class="mega lob">${esc(g.title)}</h1>
    <ol class="steps-big">${steps.map((t,i)=>`<li><i>${i+1}</i><span>${t}</span></li>`).join("")}</ol></div>
    ${qrCard()}
  </section>
  <p class="eyebrow" style="margin-top:min(24px,1.8vh)">The contestants · ${ts.length} trainees · ${g.total} ${g.total===1?"round":"rounds"}</p>
  <div class="field">${ts.map(t=>`<div class="runner">${cloth(t)}<b>${esc(t.name)}</b></div>`).join("")}</div>
  <div class="joined">
    <div class="metric"><span>Players in</span><b>${roster.length}</b></div>
    <div class="chiprow">${roster.map(r=>`<span class="chip${r.on?"":" off"}">${esc(r.nick)}</span>`).join("")||'<span class="muted">Nobody yet. Players appear here as they join.</span>'}</div>
  </div>`;
}
function toteHTML(g,bets,ans){
  const bk=book(bets),ts=trainees(g),flash=ans&&!S.seen.has("b"+g.round.k);if(ans)S.seen.add("b"+g.round.k);
  const bump=S.lastPot!==null&&S.lastPot!==bk.total;S.lastPot=bk.total;
  const rows=ts.map(t=>{
    const s=bk.by[t.id]||0,nb=Object.values(bets).filter(b=>b.t===t.id).length;
    const cls=ans?(t.id===ans?" winner"+(flash?" flash":""):" loser"):"";
    const w=bk.stakes?Math.round(s/bk.stakes*100):0;
    return `<div class="toterow${cls}">${cloth(t)}<div class="min0"><div class="nm">${esc(t.name)}${t.id===ans?'<span class="wtag">WINNER</span>':""}</div><div class="line"><div class="bar"><i style="width:${w}%"></i></div><span class="sub">${fmt(s)} · ${nb} ${nb===1?"bet":"bets"}</span></div></div><div class="odds">${oddsText(bk.total,s)}</div></div>`;
  }).join("");
  return `<div class="tote">
    <div class="totehead"><div class="metric"><span>Pot</span><b class="${bump?"bump":""}">${fmt(bk.total)}</b></div><div class="metric small"><span>Bets</span><b>${bk.count}</b></div>${g.seed?`<div class="metric small"><span>House money</span><b>${fmt(g.seed)}</b></div>`:""}</div>
    <div class="rows${ts.length>5&&g.phase==="betting"?" two":""}">${rows}</div>
  </div>`;
}
function multLabel(m){return m>=20?"Jackpot! Winners' payout × 20":m>=10?"Mega bonus! Payout × 10":m>1?`Winners' payout × ${m}`:"No bonus this round"}
function boardRace(g){
  const r=g.round,bets=liveBets(),ans=g.phase==="revealed"?r.answer:null,m=r.mult||1;
  const long=String(r.text||"").length>70?" long":"";
  const pill=g.phase==="betting"?'<span class="pill open">Betting open</span>':g.phase==="locked"?'<span class="pill shut">Betting closed</span>':'<span class="pill res">Result</span>';
  const head=`<div class="racehead"><span class="raceno">Round ${r.n+1} <small>of ${g.total}</small></span>${pill}${ans&&m>1?`<span class="pill mult">${m}× round</span>`:""}</div>`;
  if(g.phase==="locked"&&g.wheel){
    const si=spinInfo(r);let over="";
    if(!si)over=`<p class="wheelcap">Spin for this round's multiplier</p>`;
    else if(si.done){over=`<div class="multi${si.mult>=10?" jackpot":""}${S.seen.has("m"+r.k)?"":" pop"}"><b>${si.mult}×</b><span>${multLabel(si.mult)}</span></div>`;S.seen.add("m"+r.k)}
    return `<section>${head}<h2 class="statement sm${long}">${esc(r.text)}</h2>
      <div class="lockgrid"><div class="wheelbox">${wheelHTML(r,"big")}<div class="wheelover">${over}</div></div><div class="min0">${toteHTML(g,bets,null)}</div></div></section>`;
  }
  if(ans){
    const st=settle(r,g.seed),wt=trainee(ans),first=!S.seen.has("p"+r.k);S.seen.add("p"+r.k);
    const winners=Object.entries(st.nets).filter(([k])=>r.bets[k].t===ans).sort((a,b)=>b[1]-a[1]);
    if(winners.length&&first&&m>=2)S.fx.add("confetti");
    const verdict=winners.length
      ?`<p class="verdict">${winners.length} ${winners.length===1?"player":"players"} split the <b>${fmt(st.pot)}</b> pot${m>1?` <b>× ${m}</b>`:""}.</p><div class="payouts${first?" popin":""}">${winners.map(([k,n])=>`<span class="chip">${esc(nickOf(k))} <span class="plus">${signed(n)}</span></span>`).join("")}</div>`
      :`<p class="verdict">Nobody picked ${esc(wt.name)}. The house keeps the <b>${fmt(st.pot)}</b> pot.</p>`;
    return `<section>${head}<h2 class="statement sm${long}">${esc(r.text)}</h2>
      <div class="resultgrid"><div class="resultcard"><p class="eyebrow">It was</p><div class="itwas">${cloth(wt)}<b>${esc(wt.name)}</b></div>${verdict}</div><div class="min0">${toteHTML(g,bets,ans)}</div></div></section>`;
  }
  return `<section>${head}<h2 class="statement${long}">${esc(r.text)}</h2>${toteHTML(g,bets,null)}</section>`;
}
function ladderGrid(st,showD,avail){
  const n=st.length,cols=n<=7?1:n<=14?2:n<=24?3:4,rows=Math.max(1,Math.ceil(n/cols));
  return `<div class="ladgrid" style="--cols:${cols};--rows:${rows};--avail:${avail}">${st.map((p,i)=>{const rk=rankAt(st,i),d=p.d;return `<div class="lrow${rk<=3?" podium":""}"><span class="rk">${rk}</span><span class="pn">${esc(p.nick)}</span>${showD?`<span class="pd ${d>0?"up":d<0?"down":""}">${d?signed(d):"±0"}</span>`:"<span></span>"}<span class="pb">${fmt(p.bal)}</span></div>`}).join("")}</div>`;
}
function boardStandings(g,final){
  const st=standings(),n=rounds(g).length;
  if(final&&st.length){
    const ch=champions(st);fxOnce("final-board-"+g.gid);
    const bill=g.payer?`<div class="bill"><b>${fmt(ch[0].bal)}</b><span>${ch.length>1?"Send your Tikkies":"Send your Tikkie"} to ${esc(g.payer)}</span></div>`:"";
    return `<section><p class="eyebrow">Final result · ${n} ${n===1?"round":"rounds"}</p><div class="champ"><div class="trophy" aria-hidden="true">1</div><div class="min0"><h1 class="mega" style="margin:0;font-size:clamp(34px,min(6vw,8.5vh),96px)">${namesList(ch)}</h1><p class="lede">${ch.length>1?"share the win":"wins"} with <b>${fmt(ch[0].bal)}</b></p></div></div>${bill}${ladderGrid(st,false,"calc(100vh - 480px)")}</section>`;
  }
  return `<section><p class="eyebrow">${final?"Final result":`Standings after round ${n} of ${g.total}`}</p><h1 class="mega sm">${final?"No bets placed":"The leaderboard"}</h1>${st.length?ladderGrid(st,n>0&&!final,"calc(100vh - 300px)"):""}</section>`;
}
function btn(act,label,cls,extra){return `<button class="btn ${cls||""}" data-act="${act}" ${S.busy?"disabled":""} ${extra||""}>${label}</button>`}
function dockHTML(){
  const g=S.game,live=onlineCount();
  const conn=`<b>${live}</b> ${live===1?"phone":"phones"} connected`;
  let status="",btns="";S.primary=null;
  if(!g){status="No game running";btns=btn("view","Go to setup","primary",'data-v="setup"')}
  else{
    const last=g.idx+1>=g.total,nextLabel=last?"Final results":`Open round ${g.idx+2}`;
    const qr=`<button class="btn ghost" data-act="qr">Show QR</button>`;
    switch(g.phase){
      case "lobby":status=`Lobby · ${conn}`;btns=btn("open1","Open round 1","primary");S.primary="open1";break;
      case "betting":{const n=Object.keys(liveBets()).length;status=`Round ${g.idx+1} of ${g.total} · <b>${n}</b> ${n===1?"bet":"bets"} in · ${conn}`;btns=qr+btn("close","Close betting","primary");S.primary="close";break}
      case "locked":{
        status=`Round ${g.idx+1} of ${g.total} · betting closed`;
        const si=spinInfo(g.round);
        if(g.wheel&&!si){btns=btn("reopen","Reopen betting","ghost")+btn("spin","Spin the wheel!","spin");S.primary="spin"}
        else if(g.wheel&&!si.done){btns=`<button class="btn primary" disabled>Spinning…</button>`}
        else{btns=(g.wheel?"":btn("reopen","Reopen betting","ghost"))+btn("reveal","Reveal the answer","primary");S.primary="reveal"}
        break;
      }
      case "revealed":status=`Round ${g.idx+1} of ${g.total} · result`;btns=btn("standings","Show standings","ghost")+btn("next",nextLabel,"primary");S.primary="next";break;
      case "standings":status=`Standings after round ${g.idx+1} · ${conn}`;btns=qr+btn("next",nextLabel,"primary");S.primary="next";break;
      case "final":status=`Game over · ${conn}`;btns=btn("again",S.confirm==="again"?"Tap again to restart":"Play again",S.confirm==="again"?"armed":"primary");break;
    }
  }
  return `<div class="dock"><div class="bulbs alt" aria-hidden="true"></div><div class="wrap"><div class="status">${status}</div><div class="btns">${btns}</div></div></div>`;
}

/* ---------- looks ---------- */
function applyLook(key){
  let t=null;
  if(S.mode==="host"&&key==="setup"&&S.draft)t=S.draft.theme;
  if(!lookOk(t)&&S.game)t=S.game.theme;
  if(!lookOk(t)&&S.host&&S.host.setup)t=S.host.setup.theme;
  if(!lookOk(t))t=lsGet("stakes.look");
  if(!lookOk(t))t=LOOKS[0][0];
  if(S.game&&lookOk(S.game.theme))lsSet("stakes.look",S.game.theme);
  if(document.documentElement.dataset.look!==t)document.documentElement.dataset.look=t;
}
/* Switch the look for every screen right away */
async function setLook(v){
  if(!lookOk(v))return;
  if(S.draft)S.draft.theme=v;
  const name=(LOOKS.find(l=>l[0]===v)||[])[1];
  try{
    if(S.host&&S.host.setup){S.host=Object.assign({},S.host,{setup:Object.assign({},S.host.setup,{theme:v})});await withTimeout(FB.update(hpath("setup"),{theme:v}),12000)}
    if(S.game){S.game=Object.assign({},S.game,{theme:v});await withTimeout(FB.update(gpath("state"),{theme:v}),12000)}
    toast(S.game?`${name}: switched on every screen`:`${name} selected`);
  }catch(e){toast(errMsg(e))}
  S.lastKey=null;render();
}
function cycleLook(){const cur=document.documentElement.dataset.look;const i=LOOKS.findIndex(l=>l[0]===cur);setLook(LOOKS[(i+1)%LOOKS.length][0])}

function normalizeSetup(d){
  d.trainees=Array.isArray(d.trainees)?d.trainees:Object.values(d.trainees||{});
  d.statements=Array.isArray(d.statements)?d.statements:Object.values(d.statements||{});
  if(d.wheel===undefined)d.wheel=true;
  if(d.payer===undefined)d.payer="Jos";
  if(!lookOk(d.theme))d.theme=LOOKS[0][0];
  delete d.prize;
  return d;
}

}
