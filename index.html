        const pct=Math.min(100,Math.round(si.votes/si.need*100));
        return slipBox(`${head}${myres}<div class="tk"><h3>Want ${esc(t.name)}'s backstory?</h3><p class="sub2">If more than half of you vote, ${esc(t.name)} tells it.</p>
          <div class="buzzring" style="--p:${pct}%">${si.voted?`<button class="buzzer done" disabled><span>✓ VOTED<small>Waiting for the others</small></span></button>`:`<button class="buzzer" data-act="vote"><span>I WANT THE STORY!<small>Tap to vote</small></span></button>`}</div>
          <p class="count">${si.votes} of ${si.need} votes <span>· ${si.left} of ${si.max} stories left</span></p></div>`);
      }
      return slipBox(`${head}${myres}<p class="label">Round ${r.n+1} · result</p><p class="q">${esc(r.text)}</p><p class="note">${st.win?`The pot of ${fmt(st.pot)}${st.m>1?` (house money ×${st.m})`:""} was split among the winners.`:`Nobody picked ${esc(t.name)}. The house keeps the pot.`}</p>${r.story?`<p class="note storyp">${esc(r.story)}</p>`:""}`);
    }
    case "standings":return slipBox(`${head}<p class="label">Standings after round ${rounds(g).length}</p>${topMini(5)}<p class="note">Next round coming up.</p>`);
    case "final":{
      const sts=standings(),i=sts.findIndex(x=>x.k===k),rk=i>=0?rankAt(sts,i):null,ch=champions(sts),iWon=ch.some(p=>p.k===k);
      let bill="";
      if(iWon){fxOnce("final-"+g.gid);if(g.payer)bill=`<div class="billcard"><p class="label">You won · ${esc(g.payer)} pays</p><p class="big">${fmt(ch[0].bal)}</p><p>Send your Tikkie to ${esc(g.payer)}.</p></div>`}
      else if(g.payer&&ch.length)bill=`<div class="billcard"><p class="label">${esc(g.payer)} pays</p><p class="big">${fmt(ch[0].bal)}</p><p>to ${namesList(ch)}${ch.length>1?" (each)":""}</p></div>`;
      const stamp=iWon?stampOnce("final"+g.gid,"win","Champion"):rk?stampOnce("final"+g.gid,"neutral",`Finished #${rk}`):"";
      return slipBox(`${head}<p class="label">Final result</p>${stamp}${bill}<p class="label">Top players</p>${topMini(5)}<p class="note">Thanks for playing ${esc(g.title)}.</p>`);
    }
  }
  return slipBox(head);
}
function sideLine(r,k){
  const sn=sideNets(r);if(!(k in sn))return "";
  return `<p class="sideline ${sn[k]>0?"win":"lose"}">Roulette colour bet: <b>${signed(sn[k])}</b></p>`;
}
function mainBetLine(r,k,m){
  const lb=r.bets&&r.bets[k];if(!lb)return `<p class="mainbet">You sat out the trainee bet this round.</p>`;
  const t=trainee(lb.t),bk=book(r.bets,m);
  return `<p class="mainbet">Your trainee bet: <b>${fmt(lb.a)} on ${esc(t?t.name:"your pick")}</b> · pays ${fmt(Math.floor(lb.a*bk.total/bk.by[lb.t]))} if right</p>`;
}
/* Roulette round on the phone: bet on the colour, watch the ball, see what it paid */
function roulSlip(g){
  const r=g.round,k=myKey(),si=spinInfo(r),lb=r.bets&&r.bets[k];
  const top=`<p class="rlabel">Round ${r.n+1} of ${g.total} · roulette</p>`;
  if(!si){
    const avail=sideAvail(),side=cleanSide(S.sideKey===r.k?S.side:{},g),mine=side[k]||null;
    if(S.sideRound!==r.k){S.sideRound=r.k;S.sideC=mine?mine.c:null;S.sideStake=mine?mine.a:Math.min(100,avail)}
    if(mine&&S.sideC===null){S.sideC=mine.c;S.sideStake=mine.a}
    S.sideStake=Math.max(0,Math.min(S.sideStake,avail));
    const title=`${top}<p class="rtitle">Roulette! Bet on the colour</p>`;
    if(avail<=0)return `${title}${mainBetLine(r,k,1)}<p class="note">All your chips are on the trainee bet, so there is nothing left for the roulette. Watch the ball on the big screen!</p>`;
    const cs=RC[S.sideC]?S.sideC:null,low=c=>RC[c].name.toLowerCase();
    const picks=["r","b","g"].map(c=>`<button class="cpick ${c}" data-act="spick" data-c="${c}" aria-pressed="${cs===c}"><b>${cs===c?"✓ ":""}${RC[c].name}</b><span>pays ${RC[c].pay}×</span></button>`).join("");
    const changed=!mine||mine.c!==cs||mine.a!==S.sideStake;
    const label=!cs?"Pick a colour":S.sideStake<=0?"Add a stake":mine?(changed?`Update: ${fmt(S.sideStake)} on ${low(cs)}`:"Colour bet placed ✓"):`Bet ${fmt(S.sideStake)} on ${low(cs)}`;
    const est=cs&&S.sideStake>0?`Pays ${fmt(S.sideStake*RC[cs].pay)} if it's ${low(cs)}`:`of ${fmt(avail)} left`;
    const coins=[[10,"c10"],[50,"c50"],[100,"c100"],[500,"c500"]].map(([v,c])=>`<button class="coin ${c}" data-act="schip" data-v="${v}" aria-label="Add ${fmt(v)}"><span>+${v}</span></button>`).join("");
    return `${title}<p class="rsub">Red or black doubles your chips, green 0 pays 20×. Wrong colour and they're gone.</p>
      <div class="cpicks">${picks}</div>
      <div class="stakerow"><b>${fmt(S.sideStake)}</b><span>${est}</span></div>
      <div class="chips rack">${coins}<button class="allinchip" data-act="sallin" aria-label="All in: bet ${fmt(avail)}"><span>ALL<br>IN</span></button></div>
      <button class="clearbar" data-act="szero"${S.sideStake<=0?" disabled":""}>✕ Clear stake</button>
      <button class="place" data-act="splace"${(!cs||S.sideStake<=0||!changed)?" disabled":""}>${label}</button>
      ${mine?`<p class="betstatus"><b>✓ ${fmt(mine.a)} on ${low(mine.c)}</b> · <button class="linkbtn" data-act="swithdraw">Withdraw</button></p>`:`<p class="betstatus">Optional. ${lb?`Your trainee bet of ${fmt(lb.a)} stays as it is.`:"You sat out the trainee bet."}</p>`}`;
  }
  const mineS=r.side&&r.side[k]&&RC[r.side[k].c]?r.side[k]:null,num=rnum(r.spin),col=rcol(num);
  if(!si.done)return `${top}<div class="wheelslot">${rouletteHTML(r,"small")}<p class="note" style="margin:0"><b>No more bets!</b> The ball is rolling…</p></div><p class="mainbet">${mineS?`Your colour bet: <b>${fmt(mineS.a)} on ${RC[mineS.c].name.toLowerCase()}</b>`:"You have no colour bet this round."}</p>`;
  const cname=`${RC[col].name.split(" ")[0]} ${num}`;
  let res;
  if(mineS){
    const won=mineS.c===col;
    if(won&&!S.seen.has("side-"+r.k)){fxOnce("side-"+r.k);buzz([60,40,60,40,180])}
    res=won?`<div class="myres win"><span class="rnum ${col}">${num}</span><div class="mr"><span>${cname} · you won</span><b>${signed(mineS.a*(RC[col].pay-1))}</b><em>Your ${fmt(mineS.a)} on ${RC[col].name.toLowerCase()} paid ${RC[col].pay}×</em></div></div>`
      :`<div class="myres lose"><span class="rnum ${col}">${num}</span><div class="mr"><span>${cname} · you lost</span><b>${fmt(mineS.a)}</b><em>You bet on ${RC[mineS.c].name.toLowerCase()}</em></div></div>`;
  }else res=`<div class="myres out"><span class="rnum ${col}">${num}</span><div class="mr"><span>The ball landed on</span><b>${cname}</b><em>No colour bet, so no money won or lost</em></div></div>`;
  const first=!S.seen.has("pm"+r.k);S.seen.add("pm"+r.k);
  return `${top}${res}<p class="paysx${first?" pop":""}" style="text-align:center;margin:12px 0 0">House money ×${si.mult}!</p>${mainBetLine(r,k,si.mult)}<p class="note">Next: who is the statement about? Watch the big screen.</p>`;
}
function bettingSlip(g){
  const r=g.round,k=myKey(),mb=balOf(balances(g),k),ts=trainees(g);
  const bets=liveBets(),bk=book(bets),mine=bets[k]||null;
  if(S.stakeRound!==r.k){S.stakeRound=r.k;S.pickT=mine?mine.t:null;S.stake=mine?Math.min(mine.a,mb):Math.min(100,mb)}
  if(mine&&S.pickT===null){S.pickT=mine.t;S.stake=Math.min(mine.a,mb)}
  S.stake=Math.max(0,Math.min(S.stake,mb));
  const up=timeLeft(g)===0,hide=!g.live;
  const rescued=g.comeback>0&&rounds(g).length>0&&balOf(balances(g,true),k)<=0;
  const q=`${rescued?`<p class="comeback">+${fmt(g.comeback)} comeback money. Keep playing!</p>`:""}<p class="rlabel">Round ${r.n+1} of ${g.total} · who is it? ${cdPill(g)}</p><p class="q bet">${esc(r.text)}</p>`;
  if(mb<=0)return q+stampOnce("bust"+g.gid,"neutral","Bust")+`<p class="note">You're out of money for this game. Watch the rest and enjoy the show.</p>`;
  const two=ts.length>=4,fresh=S.pickT!==S.lastPick;S.lastPick=S.pickT;
  const picks=ts.map(t=>{
    const o=oddsText(bk.total,bk.by[t.id]||0),cls=`pick${fresh&&S.pickT===t.id?" fresh":""}`,pr=`data-act="pick" data-t="${t.id}" aria-pressed="${S.pickT===t.id}"`;
    return two?`<button class="${cls}" ${pr}>${face(t,"sm")}<span class="min0"><span class="pn2">${esc(t.name)}</span>${hide?"":`<span class="po">${o==="—"?"no bets yet":"pays "+o}</span>`}</span></button>`
              :`<button class="${cls}" ${pr}>${face(t,"sm")}<span class="pn2">${esc(t.name)}</span><span class="po">${hide?"":o}</span></button>`;
  }).join("");
  const pt=S.pickT?trainee(S.pickT):null;
  let est="";
  if(pt&&S.stake>0){
    const tot=bk.total-(mine?mine.a:0)+S.stake,onT=(bk.by[pt.id]||0)-(mine&&mine.t===pt.id?mine.a:0)+S.stake;
    est=hide?"Payout shown when betting closes":`Pays ~${fmt(Math.floor(S.stake*tot/onT))}${g.wheel?` + ${DEV_SHORT[devOf(r)]} bonus`:" if right"}`;
  }
  const bump=S.lastStake!==null&&S.lastStake!==S.stake;S.lastStake=S.stake;
  const changed=!mine||mine.t!==S.pickT||mine.a!==S.stake;
  const label=up?"Time's up!":!pt?"Pick a trainee":S.stake<=0?"Add a stake":mine?(changed?`Update: ${fmt(S.stake)} on ${esc(pt.name)}`:"Bet placed ✓"):`Bet ${fmt(S.stake)} on ${esc(pt.name)}`;
  const mt=mine?trainee(mine.t):null;
  const coins=[[10,"c10"],[50,"c50"],[100,"c100"],[500,"c500"]].map(([v,c])=>`<button class="coin ${c}" data-act="chip" data-v="${v}" aria-label="Add ${fmt(v)}"><span>+${v}</span></button>`).join("");
  return `${q}<div class="picks${two?" grid2":""}">${picks}</div>
    <div class="stakerow"><b class="${bump?"bump":""}">${fmt(S.stake)}</b><span>${est||`of ${fmt(mb)}`}</span></div>
    <div class="chips rack">${coins}<button class="allinchip" data-act="allin" aria-label="All in: bet ${fmt(mb)}"><span>ALL<br>IN</span></button></div>
    <button class="clearbar" data-act="zero"${S.stake<=0?" disabled":""}>✕ Clear stake</button>
    <button class="place" data-act="place"${(up||!pt||S.stake<=0||!changed)?" disabled":""}>${label}</button>
    ${mine&&mt?`<p class="betstatus"><b>✓ ${fmt(mine.a)} on ${esc(mt.name)}</b> · <button class="linkbtn" data-act="withdraw">Withdraw</button></p>`:`<p class="betstatus">${g.wheel&&devOf(r)==="roul"?"Roulette round: keep some chips to bet on red or black.":"You can change your bet until betting closes."}</p>`}`;
}

/* ---------- events ---------- */
const H={
  view:b=>{S.view=b.dataset.v;S.confirm=null;S.showQR=false;render();window.scrollTo(0,0)},
  fs:()=>{const el=document.documentElement;if(!el.requestFullscreen){toast("Use your browser's full-screen mode (F11 on most laptops).");return}el.requestFullscreen().catch(()=>toast("Use your browser's full-screen mode (F11 on most laptops)."))},
  sound:()=>{SND.on=!SND.on;lsSet("stakes.sound",SND.on);if(SND.on){actx();sfx.coin()}renderChrome(screenKey())},
  qr:()=>{S.showQR=!S.showQR;render()},
  "copy-rules":()=>copyText(RULES,"Rules copied"),
  "copy-host":()=>copyText(hostURL(S.hostKey),"Host link copied"),
  open1:()=>run(()=>openRace(0)),
  close:()=>run(closeBetting),
  addtime:()=>run(addTime),
  spin:()=>run(spinWheel),
  reopen:()=>run(reopen),
  reveal:()=>run(reveal),
  standings:()=>run(showStandings),
  next:()=>run(nextRace),
  again:()=>{if(!armed("again"))return;if(!S.host||!S.host.setup){toast("Open Setup to start a new game.");return}run(startGame)},
  clear:()=>{if(!armed("clear"))return;run(async()=>{await clearPlayers();toast("Player list cleared")})},
  "add-tr":()=>{if(S.draft.trainees.length>=12)return;const id="t"+rid();S.draft.trainees.push({id,name:""});rebuildSetup("tr-"+id)},
  "rm-photo":b=>{const t=S.draft.trainees.find(x=>x.id===b.dataset.id);if(t){delete t.photo;delete t.photoL;rebuildSetup()}},
  "rm-tr":b=>{const id=b.dataset.id;if(S.draft.trainees.length<=2)return;S.draft.trainees=S.draft.trainees.filter(t=>t.id!==id);S.draft.statements.forEach(s=>{if(s.answer===id)s.answer=""});rebuildSetup()},
  "add-st":()=>{const id="s"+rid();S.draft.statements.push({id,text:"",answer:""});rebuildSetup("st-"+id)},
  "rm-st":b=>{S.draft.statements=S.draft.statements.filter(s=>s.id!==b.dataset.id);rebuildSetup()},
  examples:()=>{const have=new Set(S.draft.statements.map(s=>s.text));const add=EXAMPLES.filter(t=>!have.has(t));if(!add.length){toast("All the example statements are already in.");return}add.forEach(text=>S.draft.statements.push({id:"s"+rid(),text,answer:""}));rebuildSetup()},
  save:()=>run(async()=>{if(await saveSetup())toast("Setup saved")}),
  start:()=>{const g=S.game;if(g&&g.phase!=="final"&&!armed("start"))return;run(async()=>{if(await saveSetup()){await startGame();toast("Game started. Players can scan the QR code now.")}})},
  look:b=>setLook(b.dataset.v),
  pick:b=>{S.pickT=b.dataset.t;buzz(10);render()},
  chip:b=>{const mb=balOf(balances(S.game),myKey());S.stake=Math.min(mb,S.stake+Number(b.dataset.v));buzz(8);render()},
  allin:()=>{S.stake=balOf(balances(S.game),myKey());buzz([15,20,15]);render()},
  zero:()=>{S.stake=0;buzz(12);render()},
  place:()=>placeBet(),
  vote:()=>voteStory(),
  withdraw:()=>withdrawBet(),
  spick:b=>{S.sideC=b.dataset.c;buzz(10);render()},
  schip:b=>{S.sideStake=Math.min(sideAvail(),S.sideStake+Number(b.dataset.v));buzz(8);render()},
  sallin:()=>{S.sideStake=sideAvail();buzz([15,20,15]);render()},
  szero:()=>{S.sideStake=0;buzz(12);render()},
  splace:()=>placeSide(),
  swithdraw:()=>withdrawSide(),
  rename:()=>{S.lastKey=null;const n=S.me.nick;S.me.nick="";render();const el=$("#nick");if(el){el.value=n;el.select()}}
};
document.addEventListener("click",e=>{
  if(S.mode==="host"&&SND.on)actx();
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=H[b.dataset.act];if(f){e.preventDefault();f(b,e)}
});
document.addEventListener("submit",async e=>{
  const id=e.target.id;e.preventDefault();
  if(id==="join-form"){
    const n=cleanNick($("#nick").value);if(!n){toast("Type a nickname first.");return}
    S.me.nick=n;lsSet("stakes.me",S.me);registerMe();buzz(30);S.lastKey=null;render();window.scrollTo(0,0);
  }else if(id==="join-code-form"){
    const c=$("#code-in").value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);if(!c||!DBURL){toast("Type the room code from the big screen.");return}
    location.hash=`join=${c}&db=${shortDb(DBURL)}`;
  }else if(id==="host-form"){
    const url=normDb($("#db-in").value);
    if(!url){toast("That doesn't look like a Firebase database URL. It ends in firebaseio.com or firebasedatabase.app.");return}
    if(S.busy)return;S.busy=true;toast("Checking the database…");
    try{
      await connect(url);const key=randStr(20);
      await withTimeout(FB.set(`hosts/${key}/created`,Date.now()),12000);
      DBURL=url;lsSet("stakes.db",url);lsSet("stakes.hostlink",hostURL(key));
      location.hash=`host=${key}&db=${shortDb(url)}`;
    }catch(err){S.busy=false;if(isPerm(err)){S.problem="rules";render()}else toast(err&&err.code==="timeout"?"The database didn't answer. Check the URL and try again.":"Couldn't connect to that database. Check the URL.")}
  }
});
document.addEventListener("input",e=>{
  const el=e.target,d=S.draft;if(!d)return;
  if(el.dataset.f)d[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;
  else if(el.dataset.tr){const t=d.trainees.find(x=>x.id===el.dataset.tr);if(t){t.name=el.value;const i=d.trainees.indexOf(t);document.querySelectorAll(`option[value="${t.id}"]`).forEach(o=>{o.textContent=`#${i+1} ${el.value||"Trainee "+(i+1)}`})}}
  else if(el.dataset.st){const s=d.statements.find(x=>x.id===el.dataset.st);if(s)s.text=el.value}
  else if(el.dataset.sy){const s=d.statements.find(x=>x.id===el.dataset.sy);if(s)s.story=el.value}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.photo&&S.draft&&el.files&&el.files[0]){loadPhoto(el.dataset.photo,el.files[0]);el.value="";return}
  if(el.dataset.sa&&S.draft){const s=S.draft.statements.find(x=>x.id===el.dataset.sa);if(s)s.answer=el.value}
  else if(el.type==="checkbox"&&el.dataset.f&&S.draft)S.draft[el.dataset.f]=el.checked;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.showQR){S.showQR=false;render();return}
  if((e.key==="t"||e.key==="T")&&S.mode==="host"&&S.lastKey==="board"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.target.closest("input,textarea,select,[contenteditable]")){e.preventDefault();cycleLook();return}
  if(e.key!=="ArrowRight"||S.mode!=="host"||!S.primary||S.busy||S.lastKey!=="board")return;
  if(e.target.closest("input,textarea,select,[contenteditable]"))return;
  e.preventDefault();if(SND.on)actx();const f=H[S.primary];if(f)f();
});

/* ---------- boot ---------- */
async function boot(){
  const saved=lsGet("stakes.me");
  S.me=saved&&typeof saved.pid==="string"&&/^[a-z0-9]{8,32}$/.test(saved.pid)?{pid:saved.pid,nick:cleanNick(saved.nick)}:{pid:randStr(16),nick:""};
  lsSet("stakes.me",S.me);
  if(S.mode==="landing"||!DBURL){S.mode="landing";render();return}
  render();
  try{await connect(DBURL)}catch(e){S.problem="unreachable";render();return}
  lsSet("stakes.db",DBURL);
  if(S.mode==="host"){
    const t=setTimeout(()=>{if(S.host===undefined){S.stale=true;render()}},10000);
    FB.on(hpath(""),v=>{
      clearTimeout(t);S.host=v||{};
      if(S.host.code&&!S.code){S.code=S.host.code;subscribeGame()}
      if(!S.code&&S.view===null)S.view="setup";
      render();
    },e=>{clearTimeout(t);onDbError(e)});
  }else{
    subscribeGame();
    FB.on(".info/connected",c=>{const was=S.conn;S.conn=!!c;if(c&&!was)registerMe()},()=>{});
  }
}
boot();
