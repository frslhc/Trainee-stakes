<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a0660">
<title>The Trainee Stakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: a purple-party game-show stage. Spinning multicolour sunburst, chasing marquee bulbs,
   a bonus wheel for the big screen and a bright ticket on every phone. Single committed look. */
:root{
  color-scheme: dark;
  --stage:#6a12c9;
  --bar:#2a0660;
  --glow:radial-gradient(circle at 12% 15%,rgba(255,45,149,.6),transparent 42%),radial-gradient(circle at 88% 22%,rgba(255,224,20,.35),transparent 40%),radial-gradient(circle at 50% 110%,rgba(24,224,255,.5),transparent 52%);
  --rays:repeating-conic-gradient(rgba(255,45,149,.3) 0deg 6deg,transparent 6deg 12deg,rgba(255,255,255,.13) 12deg 18deg,transparent 18deg 24deg);
  --panel:#10032e;
  --panel-2:#1c0752;
  --line:rgba(255,255,255,.18);
  --text:#ffffff;
  --muted:#d4c6ff;
  --green:#2dff6e;
  --green-deep:#0f9e3c;
  --yellow:#ffe014;
  --yellow-deep:#b89b00;
  --magenta:#ff2d95;
  --magenta-deep:#a8125c;
  --cyan:#18e0ff;
  --orange:#ff8a1f;
  --red:#d4183a;
  --red-deep:#8a0c25;
  --purple:#a35cff;
  --ink:#160933;
  --ink-soft:#5d4f86;
  --ticket:#ffffff;
  --ticket-tint:#f0ebff;
  --ticket-line:rgba(22,9,51,.14);
  --win:#08a34a;
  --lose:#e0245e;
  --up:#2dff6e;
  --down:#ff7aa8;
  --f-display:"Bungee",Impact,"Arial Black",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--stage);
  background-image:var(--glow);
  color:var(--text);font-family:var(--f-body);font-size:15.5px;line-height:1.45;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;z-index:-1;pointer-events:none;
  background:var(--rays);
  animation:rays 300s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
img,svg{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.min0{min-width:0}
h1,h2,h3,p{margin:0}

/* marquee bulbs */
.bulbs{height:9px;background:radial-gradient(circle,var(--green) 2.6px,transparent 3.2px) 0 50%/26px 9px repeat-x,radial-gradient(circle,var(--magenta) 2.6px,transparent 3.2px) 13px 50%/26px 9px repeat-x;animation:chase .8s steps(2) infinite}
.bulbs.alt{background:radial-gradient(circle,var(--yellow) 2.6px,transparent 3.2px) 0 50%/26px 9px repeat-x,radial-gradient(circle,var(--cyan) 2.6px,transparent 3.2px) 13px 50%/26px 9px repeat-x;animation:chase .8s steps(2) infinite}
@keyframes chase{to{background-position:13px 50%,26px 50%}}

/* top bar */
.top{background:var(--bar);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-size:20px;margin-right:auto;min-width:0;line-height:1.15;overflow-wrap:anywhere;
  background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta),var(--cyan),var(--green));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.roomcode{font-family:var(--f-display);color:var(--ink);background:var(--green);font-size:14px;letter-spacing:.08em;border-radius:999px;padding:5px 12px}
.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{background:none;border:0;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--green);color:var(--ink)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--muted)}
.iconbtn[aria-pressed="true"]{border-color:var(--green);color:var(--green)}
main{padding-block:26px 56px}
body.dock-on main{padding-top:min(16px,1.2vh);padding-bottom:150px}
body.dock-on .wrap{max-width:1500px}

/* shared type */
.eyebrow{font-size:12.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.mega{font-family:var(--f-display);font-size:clamp(38px,7.2vw,98px);line-height:.95;color:var(--green);text-shadow:3px 3px 0 var(--magenta),6px 6px 0 var(--cyan);margin:10px 0 20px;text-wrap:balance;overflow-wrap:anywhere}
.lede{font-size:clamp(16px,1.6vw,20px);max-width:62ch;font-weight:700}
.lede b{color:var(--green)}
.muted{color:var(--muted)}

/* contestant tiles */
.cloth{flex:none;width:44px;height:44px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1;border-radius:12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 0 0 2px rgba(255,255,255,.6)}
.cloth.sm{width:34px;height:34px;font-size:17px;border-radius:9px}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:34px;align-items:start}
@media (max-width:880px){.lobby{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.runner{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;animation:bob 3s ease-in-out infinite}
.runner:nth-child(2n){animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-4px)}}
.runner b{font-family:var(--f-display);font-size:19px;overflow-wrap:anywhere;line-height:1.1}
.joined{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:min(24px,1.8vh);padding-top:min(18px,1.4vh);border-top:2px dashed var(--line)}
.joined .metric span{font-size:15px}
.joined .metric b{font-size:clamp(40px,min(5vw,7.5vh),80px)}
.joined .chip{font-size:clamp(15px,min(1.6vw,2.5vh),22px);padding:min(8px,.9vh) 15px}
.mega.lob{font-size:clamp(34px,min(6vw,8vh),92px);margin:6px 0 min(18px,2vh)}
.mega.sm{font-size:clamp(30px,min(5vw,7vh),72px);margin:6px 0 8px}
.steps-big{list-style:none;margin:0;padding:0;display:grid;gap:min(12px,1.1vh);max-width:1000px}
.steps-big li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;font-size:clamp(15px,min(1.9vw,2.65vh),27px);font-weight:800;line-height:1.25}
.steps-big i{font-style:normal;font-family:var(--f-display);width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--ink);font-size:.95em}
.steps-big li:nth-child(2) i{background:var(--magenta);color:var(--text)}
.steps-big li:nth-child(3) i{background:var(--yellow)}
.steps-big li:nth-child(4) i{background:var(--cyan)}
.steps-big li:nth-child(5) i{background:var(--orange)}
.steps-big b{color:var(--yellow)}
.lobby .qrcard{width:min(330px,36vh,100%);padding:14px}
.lobby .qrcard .scan{font-size:clamp(18px,3vh,26px)}
.lobby .qrcard .code{font-size:clamp(24px,4.4vh,36px)}
.runner .cloth{width:clamp(32px,5vh,44px);height:clamp(32px,5vh,44px);font-size:clamp(16px,2.6vh,22px)}
.runner{padding:min(10px,1.1vh) 12px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;min-width:0;flex:1}
.chip{display:inline-flex;gap:8px;align-items:baseline;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:800;max-width:100%;overflow-wrap:anywhere}
.payouts .chip{font-size:clamp(13px,min(1.4vw,2.2vh),19px);padding:min(6px,.7vh) 11px}
.payouts{gap:6px}
.chip.off{opacity:.5}
.chip .plus{font-family:var(--f-display);color:var(--green)}
.qrcard{background:var(--ticket);color:var(--ink);border-radius:22px;padding:18px;width:min(340px,100%);text-align:center;border:6px solid var(--green);box-shadow:0 0 0 5px var(--magenta),0 0 0 10px var(--yellow),0 18px 50px rgba(0,0,0,.45);animation:wiggle 5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.qrcard .qr{display:block;width:100%;height:auto}
.qrcard .scan{font-family:var(--f-display);font-size:26px;color:var(--magenta);line-height:1;margin-bottom:10px}
.qrcard .code{font-family:var(--f-display);font-size:36px;letter-spacing:.12em;margin-top:6px;line-height:1}
.qrcard .small{font-size:12px;font-weight:800;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:.1em}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,2,30,.9);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.overlay .qrcard{width:min(560px,86vmin);animation:none}
.overlay .qrcard .code{font-size:clamp(34px,6vmin,60px)}

/* round board */
.racehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.raceno{font-family:var(--f-display);font-size:clamp(20px,min(2.6vw,4vh),34px);color:var(--cyan);line-height:1}
.raceno small{color:var(--muted);font-size:.6em}
.pill{font-size:12.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;line-height:1;display:inline-block}
.pill.open{background:var(--green);color:var(--ink);animation:pulse 1.2s ease-in-out infinite}
.pill.shut{background:var(--red);color:var(--text)}
.pill.res{background:var(--yellow);color:var(--ink)}
.pill.mult{background:var(--magenta);color:var(--text);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.statement{font-weight:900;font-size:clamp(28px,min(5.2vw,7.4vh),112px);line-height:1.02;margin:min(12px,1.4vh) 0 min(20px,2.2vh);text-wrap:pretty;max-width:none;overflow-wrap:break-word;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.statement.sm{font-size:clamp(26px,min(3.8vw,6vh),72px);margin-bottom:min(16px,1.8vh)}
.statement.mid{font-size:clamp(27px,min(4.3vw,6.6vh),98px)}
.statement.long{font-size:clamp(26px,min(3.9vw,6vh),88px)}
.statement.sm.mid{font-size:clamp(24px,min(3.3vw,5.3vh),64px)}
.statement.sm.long{font-size:clamp(22px,min(2.9vw,4.6vh),58px)}
.tote{background:var(--panel);border:4px solid var(--green);border-radius:20px;padding:2px 20px 8px;box-shadow:0 0 0 4px var(--magenta),0 0 50px rgba(45,255,110,.35)}
.totehead{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;padding:min(12px,1.2vh) 0 min(8px,.9vh)}
.metric span{display:block;font-size:11.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.metric b{display:inline-block;font-family:var(--f-display);font-weight:400;color:var(--yellow);font-size:clamp(24px,min(3.4vw,5vh),46px);line-height:1;font-variant-numeric:tabular-nums}
.metric.small b{font-size:clamp(18px,min(2.4vw,3.4vh),30px);color:var(--text)}
.bump{animation:bump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.35);color:var(--green)}100%{transform:scale(1)}}
.toterow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:min(9px,.7vh) 0;border-top:2px dashed var(--line)}
.toterow .cloth{width:clamp(30px,5vh,54px);height:clamp(30px,5vh,54px);font-size:clamp(16px,2.8vh,26px)}
.toterow .line{display:flex;align-items:center;gap:12px;margin-top:4px}
.toterow .nm{font-family:var(--f-display);font-size:clamp(17px,min(2.2vw,3.5vh),32px);line-height:1.1;overflow-wrap:anywhere}
.toterow .sub{font-size:clamp(11px,1.7vh,15px);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{flex:1;min-width:40px;height:clamp(6px,1vh,10px);border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta));border-radius:5px;transition:width .6s ease-out}
.odds{font-family:var(--f-display);color:var(--cyan);font-size:clamp(20px,min(3vw,4.8vh),44px);text-align:right;min-width:3em;font-variant-numeric:tabular-nums;line-height:1}
.toterow.winner{background:var(--green);color:var(--ink);border-radius:14px;padding-inline:12px;margin-inline:-12px;border-top-color:transparent}
.toterow.winner .sub,.toterow.winner .odds{color:var(--ink)}
.toterow.winner .bar{background:rgba(0,0,0,.14)}
.toterow.winner .bar i{background:var(--magenta)}
.toterow.winner + .toterow{border-top-color:transparent}
.toterow.loser>:not(.face){opacity:.6}
.toterow.loser .face .ph{filter:saturate(.45)}
.toterow .face i{font-size:13px;min-width:23px;height:23px}
@media (min-width:900px){.rows.two{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}}
.wtag{display:inline-block;margin-left:10px;font-family:var(--f-body);font-size:11px;font-weight:900;letter-spacing:.14em;padding:3px 8px;border-radius:999px;background:var(--magenta);color:var(--text);vertical-align:middle;animation:pulse 1.1s ease-in-out infinite}
.verdict{margin-top:min(18px,2vh);font-size:clamp(16px,min(1.8vw,2.8vh),24px);font-weight:800;max-width:60ch}
.verdict b{color:var(--green)}
.payouts{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.popin .chip{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.popin .chip:nth-child(2){animation-delay:.12s}.popin .chip:nth-child(3){animation-delay:.24s}.popin .chip:nth-child(4){animation-delay:.36s}.popin .chip:nth-child(n+5){animation-delay:.48s}
.flash{animation:flash .9s ease-out 2}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(45,255,110,.95)}100%{box-shadow:0 0 0 26px rgba(45,255,110,0)}}

/* bonus wheel */
.lockgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:min(30px,2.4vw);align-items:start}
@media (max-width:880px){.lockgrid{grid-template-columns:minmax(0,1fr)}}
.wheelbox{position:relative;display:grid;justify-items:center;text-align:center}
.wheel{position:relative;width:100%;max-width:min(680px,max(260px,calc(100vh - 350px)));aspect-ratio:1/1;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45)) drop-shadow(0 0 20px rgba(255,214,110,.3))}
.wheel.small{max-width:250px;filter:drop-shadow(0 6px 16px rgba(22,9,51,.35))}
.wheel>svg,.wheel>.wheel-disc{position:absolute;inset:0;width:100%;height:100%}
.wheel-disc{transform-origin:50% 50%;will-change:transform}
.wheel-disc svg{display:block;width:100%;height:100%}
.wheel .rim{fill:var(--panel);stroke:var(--green);stroke-width:4}
.wheel .b0{fill:var(--green);animation:blink .7s steps(2) infinite}
.wheel .b1{fill:var(--magenta);animation:blink .7s steps(2) infinite;animation-delay:.35s}
.wheel .b2{fill:var(--yellow);animation:blink .7s steps(2) infinite;animation-delay:.18s}
@keyframes blink{50%{opacity:.2}}
.wheel .hub{fill:var(--ink);stroke:var(--green);stroke-width:4}
.wheel .hubtxt{font-family:var(--f-display);fill:#ffdf7e;font-size:16px}
.wheel .hubtxt.sm{font-size:11px}
.wheel .pointer{fill:var(--text);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.multi{display:grid;justify-items:center;line-height:1}
.multi b{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,min(6vw,9vh),100px);color:var(--green);text-shadow:4px 4px 0 var(--magenta),8px 8px 0 var(--cyan)}
.multi.jackpot b{background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta),var(--cyan),var(--green));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:shimmer 2s linear infinite;filter:drop-shadow(4px 4px 0 var(--ink))}
.multi span{font-size:14px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);margin-top:6px}
.pop{animation:pop .7s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.wheelcap{font-weight:900;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-size:clamp(14px,2vh,18px)}
.wheelover{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:7%;pointer-events:none}
.wheelover .multi{background:var(--panel);border:4px solid var(--green);border-radius:22px;padding:8px 26px 12px;box-shadow:0 0 0 4px var(--magenta),0 14px 30px rgba(0,0,0,.45)}
.resultgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:min(30px,2.4vw);align-items:start}
.resultcard{min-width:0}
.itwas{display:flex;align-items:center;gap:18px;margin:12px 0 2px}
.itwas .cloth{width:clamp(56px,10vh,96px);height:clamp(56px,10vh,96px);font-size:clamp(28px,5vh,46px);border-radius:20px}
.itwas b{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,min(4.6vw,8vh),84px);line-height:1;overflow-wrap:anywhere}
@media (max-width:880px){.resultgrid{grid-template-columns:minmax(0,1fr)}}
.flashbang{position:fixed;inset:0;pointer-events:none;z-index:65;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(45,255,110,.45) 35%,rgba(255,45,149,.25) 60%,transparent 80%);animation:fb .9s ease-out forwards}
@keyframes fb{from{opacity:1}to{opacity:0}}

/* standings + final */
.ladder{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:14px;background:var(--panel);border-radius:16px;overflow:hidden}
.ladder tr:first-child td{border-top:0}
.ladder td:first-child{padding-left:18px}
.ladder td:last-child{padding-right:18px}
.ladder td{padding:10px 8px;border-top:2px dashed var(--line);vertical-align:middle}
.rk{font-family:var(--f-display);font-size:26px;color:var(--muted);width:2.4em}
.ladder tr.podium .rk{color:var(--green)}
.pn{font-family:var(--f-display);font-size:clamp(18px,2vw,28px);overflow-wrap:anywhere;line-height:1.1}
.pb{font-family:var(--f-display);color:var(--yellow);font-size:clamp(18px,2.2vw,30px);text-align:right;white-space:nowrap}
.pd{text-align:right;font-size:13px;font-weight:800;white-space:nowrap;color:var(--muted);width:6em}
.pd.up{color:var(--up)}
.pd.down{color:var(--down)}
.ladgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),auto);grid-auto-flow:column;column-gap:30px;background:var(--panel);border-radius:18px;padding:6px 20px;margin-top:min(14px,1.6vh);font-size:clamp(13px,calc(var(--avail) / var(--rows) * .5),32px)}
.lrow{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:.6em;align-items:center;padding:.3em 0;border-bottom:2px dashed var(--line);font-variant-numeric:tabular-nums;min-width:0}
.lrow .rk{font-family:var(--f-display);font-size:1em;width:auto;color:var(--muted)}
.lrow.podium .rk{color:var(--green)}
.lrow .pn{font-family:var(--f-display);font-size:.9em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lrow .pd{font-size:.55em;font-weight:800;color:var(--muted);white-space:nowrap}
.lrow .pd.up{color:var(--up)}
.lrow .pd.down{color:var(--down)}

@media (max-width:700px){.ladgrid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row;font-size:17px}}
.champ{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.trophy{flex:none;width:clamp(56px,9vh,78px);height:clamp(56px,9vh,78px);border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--ink);font-family:var(--f-display);font-size:38px;box-shadow:0 0 0 5px var(--magenta),0 0 0 10px var(--yellow);animation:pulse 1.4s ease-in-out infinite}

.bill span{font-weight:900;font-size:clamp(16px,1.8vw,22px)}

/* host dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.dock .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px}
.dock .status{margin-right:auto;font-size:13.5px;font-weight:800;color:var(--muted);min-width:0;flex:1 1 220px}
.dock .status b{color:var(--text)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:900;font-size:14.5px;background:var(--text);color:var(--ink);line-height:1.2;text-decoration:none;display:inline-block}
.btn.primary{background:var(--green);color:var(--ink);box-shadow:0 4px 0 var(--green-deep);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--green-deep),0 0 24px rgba(45,255,110,.75)}}
.btn.primary:active,.btn.spin:active{transform:translateY(2px)}
.btn.spin{background:linear-gradient(90deg,var(--magenta),var(--orange));color:var(--text);box-shadow:0 4px 0 var(--magenta-deep);animation:shake 2s ease-in-out infinite}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-4deg)}85%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.armed{background:var(--red);color:var(--text)}
.btn:disabled{animation:none}
.kbd{font-size:11.5px;color:var(--muted)}

/* phone ticket */
.slipwrap{max-width:520px;margin:0 auto}
.slipwrap>*{min-width:0}
.slip{position:relative;background:var(--ticket);color:var(--ink);border-radius:22px;padding:28px 18px 22px;overflow:hidden;box-shadow:0 0 0 4px var(--green),0 18px 40px rgba(0,0,0,.45)}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--magenta),var(--cyan),var(--green));background-size:200% 100%;animation:shimmer 3s linear infinite}
.sliphead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px dashed var(--ticket-line);padding-bottom:12px;margin-bottom:16px}
.sliptitle{font-family:var(--f-display);font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.serial{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px;font-variant-numeric:tabular-nums}
.bal{text-align:right;flex:none}
.bal span{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.bal b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;color:var(--magenta);font-variant-numeric:tabular-nums;margin-top:4px}
.q{font-weight:900;font-size:clamp(29px,7.8vw,40px);line-height:1.06;text-wrap:balance;margin:2px 0 6px;overflow-wrap:anywhere}
.label{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 8px}
.picks{display:grid;gap:7px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--ticket-tint);border:3px solid transparent;border-radius:14px;padding:7px 12px 7px 7px;color:var(--ink);transition:transform .08s}
.pick:active{transform:scale(.97)}
.pick .pn2{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere;line-height:1.1}
.pick .po{font-family:var(--f-display);font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--green)}
.pick.fresh{animation:pop .4s cubic-bezier(.2,1.7,.4,1)}
.pick[aria-pressed="true"] .po{color:var(--ink)}
.stake{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stake b{display:inline-block;font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.stake span{font-size:13px;font-weight:800;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;justify-content:space-between}
.coin{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.92),inset 0 0 0 8px currentColor,0 4px 0 rgba(22,9,51,.35);transition:transform .08s}
.coin:active{transform:scale(.88) rotate(-14deg)}
.coin span{color:var(--ink)}
.coin.c10{background:var(--cyan);color:#0b8fb0}
.coin.c50{background:var(--magenta);color:#b31767}
.coin.c100{background:var(--green);color:#0b9a3a}
.coin.c500{background:var(--purple);color:#5a22b8}
.coin.c50 span,.coin.c500 span{color:var(--ink)}
.stakebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sbtn{border:0;border-radius:14px;padding:13px 10px;font-weight:900;font-size:15.5px;letter-spacing:.02em;transition:transform .08s}
.sbtn:active{transform:translateY(3px)}
.sbtn.clear{background:var(--red);color:var(--text);box-shadow:0 5px 0 var(--red-deep)}
.sbtn.allin{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--yellow-deep)}
.place{width:100%;margin-top:16px;border:0;border-radius:14px;padding:16px;background:var(--green);color:var(--ink);font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--green-deep);transition:transform .08s}
.place:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-deep)}
.place:disabled{box-shadow:none;background:var(--ticket-tint)}
.note{font-size:13.5px;color:var(--ink-soft);margin-top:12px;font-weight:700}
.note b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--ink);font-weight:800;font-size:13.5px}
.betbox{display:flex;gap:12px;align-items:center;background:var(--ticket-tint);border-radius:14px;padding:10px 12px;margin-top:10px}
.betbox b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.betbox .min0>span{display:block;font-size:13px;font-weight:800;color:var(--ink-soft)}
.stamp{display:inline-block;border:4px solid currentColor;border-radius:12px;padding:6px 14px;font-family:var(--f-display);font-size:26px;letter-spacing:.04em;transform:rotate(-5deg);margin:8px 0 10px;line-height:1.1}
.stamp.win{color:var(--win)}
.stamp.lose{color:var(--lose)}
.stamp.neutral{color:var(--ink-soft)}
.anim{animation:thump .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes thump{from{transform:rotate(-5deg) scale(1.8);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.mini{display:grid;gap:7px;margin-top:6px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.mrow .mn{font-weight:900;overflow-wrap:anywhere}
.mrow .mv{font-weight:900}
.mrow.me{background:var(--green);border-radius:8px;padding:3px 7px;margin-inline:-7px}
.mrow.me .mrk{color:var(--ink)}
.mbar{height:7px;border-radius:4px;background:var(--ticket-line);margin-top:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--magenta))}
.mrk{font-family:var(--f-display);font-size:18px;width:1.6em;color:var(--ink-soft)}
.wheelslot{display:grid;justify-items:center;gap:8px;margin-top:6px;text-align:center}
.paysx{font-family:var(--f-display);font-size:24px;color:var(--magenta)}
.billcard{margin-top:14px;background:var(--yellow);border-radius:16px;padding:14px 16px;transform:rotate(-1deg)}
.billcard .big{font-family:var(--f-display);font-size:40px;line-height:1}
.billcard .label{margin-top:0;color:var(--ink)}
.billcard p:last-child{font-weight:900;margin-top:6px}
.join-in{width:100%;padding:13px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--ticket-tint);color:var(--ink);font:inherit;font-weight:800;font-size:17px;margin-top:6px}
.join-in:focus{outline:3px solid var(--magenta);outline-offset:1px}
.join-in.code{font-family:var(--f-display);font-size:24px;letter-spacing:.2em;text-transform:uppercase}
pre.rules{background:var(--ticket-tint);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.4;overflow-x:auto;margin:8px 0 0;color:var(--ink)}
ol.steps{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink-soft);display:grid;gap:4px;font-weight:700}
ol.steps b{color:var(--ink)}

/* setup */
.setup{max-width:900px;margin:0 auto;display:grid;gap:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px}
.card h2{font-family:var(--f-display);font-weight:400;color:var(--green);font-size:22px;line-height:1.1}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 14px;max-width:64ch;font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:grid;gap:6px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label.check{display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;margin-bottom:12px}
label.check input{width:22px;height:22px;accent-color:var(--green)}
.inp{width:100%;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;font-weight:700;font-size:15px;letter-spacing:normal;text-transform:none}
.inp:focus{border-color:var(--green);outline:none}
textarea.inp{resize:vertical;min-height:46px;line-height:1.35}
.tlist{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.srow{display:grid;grid-template-columns:2em minmax(0,1fr) minmax(140px,210px) 42px;grid-template-areas:"n t w x";gap:10px;align-items:start;padding:12px 0;border-top:2px dashed var(--line)}
.srow:first-of-type{border-top:0}
.srow .sn{grid-area:n;font-family:var(--f-display);font-size:20px;color:var(--cyan);padding-top:6px}
.srow textarea{grid-area:t}
.srow select{grid-area:w}
.srow .x{grid-area:x}
@media (max-width:620px){.srow{grid-template-columns:2em minmax(0,1fr) 42px;grid-template-areas:"n t x" ". w ."}}
.x{background:none;border:2px solid var(--line);border-radius:10px;width:42px;height:44px;color:var(--muted);font-size:15px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.setup-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
.setup-actions .muted{margin-right:auto;font-size:13.5px;font-weight:700}
.exnote{display:inline-block;background:rgba(255,224,20,.15);color:var(--yellow);border-radius:6px;padding:1px 7px;font-weight:800}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbox code{flex:1 1 240px;min-width:0;overflow-wrap:anywhere;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--muted)}
.warn{color:var(--yellow);font-size:13.5px;font-weight:800;margin-top:10px}
.setup .btn.primary{animation:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:900;font-size:14px;z-index:60;width:max-content;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

@media (max-width:520px){.tote{padding-inline:12px}.toterow{gap:10px}.totehead{gap:20px}.brand{font-size:17px}.coin{width:58px;height:58px}}

/* ---------- switchable looks (purple party is the default above) ---------- */
html[data-look="purple"] :is(.eyebrow,.raceno,.raceno small,.joined .metric span,.setup-actions .muted){color:#ffffff;text-shadow:0 1px 3px rgba(22,9,51,.55)}
html[data-look="purple"] :is(.pill.mult,.wtag){background:#160933;color:#ff7ad9}
.btn.ghost{background:rgba(0,0,0,.28)}
html[data-look="neon"]{--stage:#17053d;--bar:#10032e;
  --glow:radial-gradient(circle at 12% 18%,rgba(45,255,110,.2),transparent 34%),radial-gradient(circle at 88% 26%,rgba(255,45,149,.22),transparent 36%),radial-gradient(circle at 50% 105%,rgba(24,224,255,.2),transparent 45%);
  --rays:repeating-conic-gradient(rgba(45,255,110,.13) 0deg 6deg,transparent 6deg 12deg,rgba(255,45,149,.13) 12deg 18deg,transparent 18deg 24deg,rgba(255,224,20,.12) 24deg 30deg,transparent 30deg 36deg,rgba(24,224,255,.13) 36deg 42deg,transparent 42deg 48deg)}
html[data-look="burst"]{--stage:#17053d;--bar:#10032e;--glow:none;
  --rays:repeating-conic-gradient(rgba(45,255,110,.55) 0deg 7deg,transparent 7deg 14deg,rgba(255,45,149,.55) 14deg 21deg,transparent 21deg 28deg,rgba(255,224,20,.5) 28deg 35deg,transparent 35deg 42deg,rgba(24,224,255,.55) 42deg 49deg,transparent 49deg 56deg)}
html[data-look="burst"] :is(.statement,.lede,.raceno,.eyebrow,.verdict,.steps-big li,.itwas b,.joined .metric span,.joined .metric b){text-shadow:0 2px 0 #160933,0 0 14px #160933,0 0 28px #160933}
html[data-look="orange"]{--stage:#d04a02;--bar:#2b1205;--panel:#2b1205;--panel-2:#3d1a07;--green:#ffb600;--green-deep:#a87800;--magenta:#db536a;--magenta-deep:#8f2c3d;--cyan:#ffe9b8;--orange:#eb8c00;--muted:#ffd6bf;--up:#ffb600;
  --glow:radial-gradient(circle at 10% 12%,rgba(120,28,0,.45),transparent 40%),radial-gradient(circle at 90% 20%,rgba(110,20,10,.4),transparent 40%),radial-gradient(circle at 50% 110%,rgba(90,18,0,.45),transparent 55%);
  --rays:repeating-conic-gradient(rgba(80,14,0,.2) 0deg 6deg,transparent 6deg 12deg)}
html[data-look="orange"] :is(.joined .metric span,.joined .metric b,.raceno small,.setup-actions .muted,.joined .muted,.lede){color:#ffffff}
html[data-look="orange"] :is(.pill.shut,.pill.mult,.wtag){background:#2b1205;color:#ffb600}
html[data-look="orange"] .mega{color:#ffffff;text-shadow:3px 3px 0 #db536a,6px 6px 0 #2b1205}

html[data-look="orange"] .multi.jackpot b{filter:drop-shadow(4px 4px 0 #2b1205)}
html[data-look="orange"] :is(.multi span,.eyebrow,.raceno){color:#ffffff}
html[data-look="orange"] :is(.lede b,.verdict b,.steps-big b){color:#ffb600;background:#2b1205;padding:0 .25em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
html[data-look="orange"] .statement{text-shadow:0 3px 0 rgba(43,18,5,.45)}
html[data-look="orange"] .qrcard{box-shadow:0 0 0 5px #db536a,0 0 0 10px #2b1205,0 18px 50px rgba(0,0,0,.35)}
html[data-look="orange"] .coin.c100{color:#a87800}
html[data-look="green"]{--stage:#1fe060;--bar:#10032e;
  --glow:radial-gradient(circle at 12% 15%,rgba(255,224,20,.6),transparent 42%),radial-gradient(circle at 88% 22%,rgba(24,224,255,.45),transparent 40%),radial-gradient(circle at 50% 110%,rgba(255,255,255,.4),transparent 52%);
  --rays:repeating-conic-gradient(rgba(255,255,255,.24) 0deg 6deg,transparent 6deg 12deg,rgba(255,224,20,.28) 12deg 18deg,transparent 18deg 24deg)}
html[data-look="green"] :is(.statement,.lede,.raceno,.raceno small,.eyebrow,.verdict,.steps-big li,.itwas b,.joined .metric span,.joined .metric b,.joined .muted,.setup-actions .muted,main>.wrap>section>.muted){color:#160933;text-shadow:none}
html[data-look="green"] :is(.lede b,.verdict b,.steps-big b){color:#a8125c}
html[data-look="green"] .mega{color:#ffffff;text-shadow:3px 3px 0 #ff2d95,6px 6px 0 #160933}
html[data-look="green"] .multi:not(.jackpot) b{color:#ffffff;text-shadow:4px 4px 0 #ff2d95,8px 8px 0 #160933}

html[data-look="green"] :is(.wheel .rim,.wheel .hub){stroke:#ffe014}
html[data-look="green"] .wheel .b0{fill:#ffe014}
html[data-look="green"] .qrcard{border-color:#ffe014;box-shadow:0 0 0 5px #ff2d95,0 0 0 10px #160933,0 18px 50px rgba(0,0,0,.35)}

.looks{display:flex;flex-wrap:wrap;gap:8px}
.lookbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:999px;padding:7px 14px 7px 8px;font-weight:800;font-size:14px}

.lookbtn i{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}

/* ---------- compact phone ticket (players) ---------- */
body.player .top .wrap{padding-block:6px}
body.player .brand{font-size:15px}
body.player .roomcode{font-size:12px;padding:3px 10px}
body.player .bulbs{height:7px}
body.player main{padding-block:10px 20px}
body.player .slip{padding:17px 14px 14px;border-radius:18px}
body.player .slip::before{height:7px}
.tickhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px dashed var(--ticket-line)}
.tickhead .who{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--f-display);font-size:17px}
.tickhead .who span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tickhead .bal2{font-family:var(--f-display);color:var(--magenta-deep);font-size:20px;white-space:nowrap;line-height:1}
.tickhead .bal2 small{font-family:var(--f-body);font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--ink-soft);margin-right:6px;text-transform:uppercase}
.rlabel{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 3px}
.q.bet{font-size:clamp(22px,min(7vw,4.1vh),32px);margin:0 0 clamp(8px,1.4vh,14px);line-height:1.1}
.picks.grid2{grid-template-columns:1fr 1fr;gap:clamp(6px,1vh,10px)}

.picks.grid2 .pick:last-child:nth-child(odd){grid-column:1/-1}
.picks.grid2 .pick .pn2{display:block;font-size:clamp(17px,calc(3.7vh - 6px),25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picks.grid2 .pick .po{display:block;font-size:clamp(12px,1.8vh,14px);margin-top:2px}

/* ---------- faces (trainee photo, or initials) ---------- */
.face{position:relative;display:inline-block;flex:none;width:var(--fs,44px);height:var(--fs,44px)}
.face .ph{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 0 0 3px #ffffff}
.face .ph{display:grid!important;place-items:center}
.face .ph img{display:block;width:100%;height:100%;object-fit:cover}
.face .ph.pic{background:#ffe9b8;box-shadow:0 0 0 3px var(--ring)}
.face .ph b{font-family:var(--f-display);font-weight:400;font-size:calc(var(--fs,44px) * .42);line-height:1;letter-spacing:-.02em}
.face i{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:22px;padding:0 4px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;font-style:normal;line-height:1;background:#160933;color:#ffffff;box-shadow:0 0 0 2px #ffffff}
.face.sm{--fs:36px}
.face.sm i{min-width:18px;height:18px;font-size:10px;border-radius:6px;right:-5px;bottom:-3px}

.face.xl .ph{box-shadow:0 0 0 6px var(--ring),0 0 0 11px var(--panel)}

.toterow .face{--fs:clamp(30px,4.9vh,56px)}
.slip .face .ph{box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 0 0 2px #160933}
.payshead{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;line-height:1.2;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 2px 3px}
.toterow .odds.hid{opacity:.5}
.rows.grow .bar i{transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
.rows.grow .odds{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.6s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ---------- countdown ---------- */
.racehead .timer{margin-left:auto}
.timer{display:inline-flex;align-items:center;gap:10px}
.timer>div{display:flex;align-items:baseline;gap:8px}
.timer svg{width:clamp(34px,5vh,54px);height:clamp(34px,5vh,54px)}
.timer .tr-bg{fill:none;stroke:rgba(0,0,0,.3);stroke-width:6}
.timer .tr-fg{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;stroke-dasharray:100.53;transition:stroke-dashoffset .25s linear}
.timer b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.2vh,42px);line-height:1;color:var(--text)}
.timer span{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.timer.hurry .tr-fg{stroke:var(--red)}
.timer.hurry b{animation:pulse 1.1s ease-in-out infinite}
.cdpill{float:right;font-family:var(--f-display);font-size:13px;letter-spacing:0;background:var(--ink);color:#ffffff;border-radius:999px;padding:2px 10px;margin-top:-2px}
.cdpill.hurry{background:var(--red);animation:pulse 1.1s ease-in-out infinite}
.comeback{background:var(--green);color:var(--ink);border-radius:10px;padding:5px 10px;font-weight:900;font-size:13px;margin:-2px 0 8px;text-align:center}
/* ---------- drumroll + story ---------- */
.toterow.out{opacity:.32}
.toterow.out .nm{text-decoration:line-through;text-decoration-thickness:3px}
.toterow.final2{animation:final2 .9s ease-in-out infinite alternate;border-radius:12px}
@keyframes final2{from{background:transparent}to{background:rgba(255,255,255,.14)}}
.drumcard{display:grid;gap:10px;align-content:start}
.drumcard .and{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,min(5vw,8vh),84px);line-height:1}
.dots{display:inline-flex;gap:.25em;margin-left:.1em}
.dots i{display:block;width:.3em;height:.3em;border-radius:50%;background:var(--green);animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.3s}.dots i:nth-child(3){animation-delay:.6s}
@keyframes dot{50%{transform:translateY(-.35em)}}
.drumq{font-family:var(--f-display);font-size:60px;line-height:1;text-align:center;color:var(--magenta-deep);animation:pulse 1.1s ease-in-out infinite;margin:4px 0 8px}

.story{margin-top:min(12px,1.3vh);background:var(--panel);border:3px solid var(--green);border-radius:16px;padding:min(10px,1.1vh) 14px;max-width:36em}
.story .k{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0}

/* ---------- setup additions ---------- */
.trow{display:flex;align-items:center;gap:10px}

.stname{font-size:clamp(22px,min(2.6vw,4.4vh),44px);font-weight:900;color:var(--text)}
.stq{font-size:clamp(22px,min(2.6vw,4.4vh),46px);font-weight:900;line-height:1.12;color:var(--text);margin-top:10px;max-width:34ch;text-wrap:pretty}

.place.vote{background:var(--magenta);color:var(--ink);box-shadow:0 5px 0 var(--magenta-deep);margin-top:12px}

/* ---------- spotlight sweep ---------- */
.sweeping .toterow:not(.spot){opacity:.42}
.toterow.spot{opacity:1;background:var(--green);color:var(--ink);border-radius:14px;padding-inline:12px;margin-inline:-12px;border-top-color:transparent;box-shadow:0 0 0 4px #ffffff,0 0 44px rgba(255,214,10,.75)}

.mini.sweep .mrow.spot{background:var(--green);box-shadow:0 0 0 3px var(--ink)}
/* ---------- phone: my result + story buzzer ---------- */
.myres{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;margin:0 0 4px}

.myres.out{background:var(--ticket-tint);color:var(--ink)}
.myres.out .mr em{color:var(--ink-soft)}
.myres.win .face i{box-shadow:0 0 0 2px #077a3c}
.tk{display:grid;justify-items:center;text-align:center;margin-top:clamp(10px,2vh,18px);padding-top:clamp(10px,2vh,16px);border-top:2px dashed var(--ticket-line)}

.buzzer{width:84%;height:84%;border-radius:50%;border:0;display:grid;place-items:center;text-align:center;padding:0 12%;font-family:var(--f-display);font-size:clamp(19px,3.2vh,25px);line-height:1.08;color:#ffffff;
  background-color:#c81a3f;background-image:radial-gradient(circle at 38% 28%,#ee4568 0,#c81a3f 42%,#8a0c25 100%);box-shadow:0 10px 0 #6e0a1e,0 14px 24px rgba(22,9,51,.4),inset 0 -6px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;animation:glowbz 1.6s ease-in-out infinite}

.buzzer.done{background-color:#077a3c;background-image:radial-gradient(circle at 38% 28%,#1fae5c 0,#077a3c 50%,#055a2c 100%);box-shadow:0 3px 0 #044a25,inset 0 -3px 0 rgba(0,0,0,.18);transform:translateY(6px);animation:none;cursor:default}
.tk .count{margin:clamp(10px,1.8vh,16px) 0 0;font-weight:900;font-size:15px;color:var(--ink)}

.pill.bonus{background:var(--panel);color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.wheelbox{grid-template-columns:minmax(0,1fr)}
.slot{--ch:6.4em;position:relative;font-size:clamp(8px,min(1.02vw,1.9vh),18px);width:35em;max-width:100%;background:linear-gradient(180deg,var(--panel-2),var(--panel)) var(--panel);border:.38em solid var(--green);border-radius:2.6em 2.6em 1.6em 1.6em;padding:.8em 1.4em 1.1em;box-shadow:0 0 0 .3em var(--magenta),0 1.1em 2.5em rgba(0,0,0,.5);text-align:center}

.slot .payline::after{right:-.2em;border-right-color:var(--magenta)}
.slot .paytable{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4em;margin-top:.8em}
.slot .pt{display:flex;align-items:center;justify-content:center;gap:.3em;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 .14em var(--line);border-radius:.7em;padding:.25em .2em}

.bres{display:grid;justify-items:center;line-height:1}

.slot .lever{position:absolute;right:-2.9em;top:9.6em;width:2.4em;height:10.5em}
.slot .lever::before{content:"";position:absolute;left:.9em;top:1.4em;width:.6em;height:8em;border-radius:.3em;background:linear-gradient(90deg,#cfcfd6,#7d7d88)}
.slot .lever::after{content:"";position:absolute;left:.1em;top:0;width:2.2em;height:2.2em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fa3,#d4183a 60%,#8f0f25);box-shadow:0 .2em 0 rgba(0,0,0,.4)}
.slot .lever i{position:absolute;left:-.7em;bottom:0;width:2.2em;height:1.6em;border-radius:.4em;background:var(--green)}
.slot.small{font-size:7px;width:auto;border-radius:1.8em;padding:1.1em 1.6em;box-shadow:0 0 0 .3em var(--magenta),0 .8em 1.6em rgba(22,9,51,.35)}
.slot.small .win{width:30em;max-width:100%}
/* ---------- bonus games: roulette ---------- */
.rtable{font-size:clamp(8px,min(1.02vw,1.8vh),16px);width:45em;max-width:100%;background:radial-gradient(ellipse at 50% 40%,#0e6e40,#07432a) #0a5433;border:.7em solid #4a230a;border-radius:2.1em;box-shadow:inset 0 0 0 .2em #e7c36a,0 0 0 .25em #2a1305,0 1.1em 2.5em rgba(0,0,0,.5);padding:.9em 1.1em;display:grid;grid-template-columns:minmax(0,26fr) minmax(0,14.3fr);gap:1.1em;align-items:center;text-align:center}
.rwheel{position:relative;width:100%;aspect-ratio:1/1;filter:drop-shadow(0 .5em .9em rgba(0,0,0,.45))}
.rwheel>svg,.rwheel>div,.rwheel .rdrop{position:absolute;inset:0;width:100%;height:100%}
.rwheel svg{display:block;width:100%;height:100%}
.rdisc,.rarm{transform-origin:50% 50%;will-change:transform}
.rtable h3{margin:0 0 .4em;font-family:var(--f-display);font-weight:400;font-size:1.45em;letter-spacing:.05em;line-height:1;text-transform:uppercase;color:#fff3c4}
.rboxes{display:grid;gap:.45em}
.rbox{position:relative;display:grid;justify-items:start;align-content:center;text-align:left;min-height:5.2em;padding:.4em 2.9em .4em .8em;box-shadow:inset 0 0 0 .16em #ffffff;border-radius:.5em;color:#ffffff}
.rbox b{font-family:var(--f-display);font-weight:400;font-size:1.7em;line-height:1;text-transform:uppercase}
.rbox span{font-size:.86em;font-weight:900;letter-spacing:.02em;margin-top:.2em}
.rbox em{font-style:normal;font-size:.95em;font-weight:800;margin-top:.1em;font-variant-numeric:tabular-nums}
.rbox.r{background:#c8102e}
.rbox.b{background:#17141c}
.rbox.g{background:#0b7a43}
.rbox.win{box-shadow:inset 0 0 0 .16em #ffffff,0 0 0 .32em #ffe014}
.rbox .dolly{position:absolute;right:.5em;top:50%;width:2em;height:2.9em;transform:translateY(-50%)}
.rdisp{margin-top:.5em;background:#160933;border-radius:.9em;padding:.5em .6em .55em;min-height:5.4em;display:grid;justify-items:center;align-content:center;gap:.15em}
.rdisp p{margin:0;font-weight:800;font-size:.95em;line-height:1.25;color:#ffffff}
.rdisp p b{font-weight:900;color:#ffe014}
.rdisp .bres b{font-size:2em;text-transform:uppercase;white-space:nowrap}
.rdisp .bres span{font-size:.72em;letter-spacing:.1em;margin-top:.3em}
/* phone: roulette colour bet */
.rtitle{font-family:var(--f-display);font-size:clamp(20px,3.4vh,27px);line-height:1.05;margin:2px 0 4px;overflow-wrap:anywhere}
.rsub{font-size:13px;font-weight:800;color:var(--ink-soft);margin:0}
.mainbet{font-size:13.5px;font-weight:800;color:var(--ink-soft);margin:10px 0 0}
.mainbet b{color:var(--ink)}
.cpicks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:clamp(8px,1.5vh,12px)}
.cpick{border:0;border-radius:14px;padding:4px;min-height:clamp(58px,10vh,86px);display:grid;justify-items:center;align-content:center;gap:3px;color:#ffffff;transition:transform .08s}
.cpick b{font-family:var(--f-display);font-weight:400;font-size:clamp(14px,2.5vh,18px);line-height:1.05}
.cpick span{font-size:12.5px;font-weight:900}
.cpick.r{background:#c8102e}
.cpick.b{background:#17141c}
.cpick.g{background:#0b7a43}
.cpick[aria-pressed="true"]{box-shadow:0 0 0 3px #ffe014,0 0 0 6px #160933}
.cpick:active{transform:scale(.96)}
.rnum{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1;color:#ffffff;box-shadow:0 0 0 3px #ffffff,0 0 0 5px #160933}
.rnum.r{background:#c8102e}
.rnum.b{background:#17141c}
.rnum.g{background:#0b7a43}
.sideline{margin:6px 0 0;border-radius:10px;padding:6px 12px;font-weight:800;font-size:14px}
.sideline b{font-weight:900}
.sideline.win{background:#077a3c;color:#ffffff}
.sideline.lose{background:#ffe3e8;color:#a0102c;box-shadow:inset 0 0 0 2px #d4183a}
.wheelslot .rwheel{width:min(230px,58vw)}
/* ---------- final screen: the Tikkie ---------- */
.finalgrid.tik{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:min(34px,2.2vw);align-items:start}
@media (max-width:880px){.finalgrid.tik{grid-template-columns:minmax(0,1fr);justify-items:center}}
.fone{font-size:clamp(9px,min(1.05vw,1.85vh),18px);width:23.25em;max-width:100%;background:#0e0c12;border-radius:2.9em;padding:.75em;box-shadow:0 0 0 .2em #3a3644,0 1.25em 2.5em rgba(0,0,0,.5);transform:rotate(2deg);margin-top:.3em}
.fone .scr{background:#f3efe6;border-radius:2.2em;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;min-height:31em}
.fone .fbar{background:#160933;color:#ffffff;display:flex;align-items:center;gap:.75em;padding:1em 1.1em .75em}
.fone .av{flex:none;width:2.75em;height:2.75em;border-radius:50%;background:#ffe014;color:#160933;display:grid;place-items:center;font-family:var(--f-display)}
.fone .fbar b{display:block;font-size:1.25em;font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.fone .fbar span{font-size:.82em;font-weight:800;color:#b9f5cd}
.fone .chat{display:flex;flex-direction:column;gap:.56em;padding:.9em .9em .65em;justify-content:flex-end}
.fone .day{align-self:center;background:#e2dccf;color:#5d4f86;border-radius:999px;padding:.25em 1em;font-size:.75em;font-weight:900;letter-spacing:.08em;margin-bottom:auto}
.bub{max-width:84%;border-radius:1.1em;padding:.55em .85em;font-size:1.03em;font-weight:800;line-height:1.3;color:#160933;box-shadow:0 1px 0 rgba(0,0,0,.12);overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:#ffe014;border-bottom-right-radius:.35em}
.bub.them{align-self:flex-start;background:#ffffff;border-bottom-left-radius:.35em}
.req{align-self:flex-end;width:88%;background:#ffffff;border-radius:1.1em;border-bottom-right-radius:.35em;padding:.75em .9em .9em;color:#160933;box-shadow:0 0 0 .2em #160933}
.req small{display:block;font-size:.72em;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#5d4f86}
.req b{display:block;font-family:var(--f-display);font-weight:400;font-size:min(2.9em,calc(21em / var(--n,6)));line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.req em{display:block;font-style:normal;font-size:.88em;font-weight:800;color:#5d4f86;margin:.15em 0 .7em;overflow-wrap:anywhere}
.req i{display:block;font-style:normal;text-align:center;background:#160933;color:#ffffff;border-radius:999px;padding:.55em;font-weight:900;font-size:1em}
.dots3{display:flex;gap:.3em;padding:.25em .1em}
.dots3 i{width:.55em;height:.55em;border-radius:50%;background:#8d86a6;animation:dot 1.2s ease-in-out infinite}
.dots3 i:nth-child(2){animation-delay:.3s}
.dots3 i:nth-child(3){animation-delay:.6s}
.fone .foot{background:#160933;color:#ffffff;text-align:center;font-weight:900;font-size:1.15em;line-height:1.2;padding:.7em .6em .9em;overflow-wrap:anywhere}
.chat.play>.bub,.chat.play>.req{animation:chatin .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes chatin{from{opacity:0;transform:translateY(.8em) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slot .bulbrow i,.dots3 i,.bres.jackpot b,.chat.play>*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.buzzer{animation:none}.landed .toterow.spot{animation:none}}
@media (prefers-reduced-motion:reduce){
  body::before,.brand,.bulbs,.runner,.qrcard,.pill,.wtag,.btn,.trophy,.slip::before,.wheel .b0,.wheel .b1,.wheel .b2,.multi.jackpot b{animation:none!important}
  .anim,.flash,.pop,.bump,.popin .chip,.pick.fresh,.toterow.final2,.mrow.final2,.dots i,.drumq,.timer b,.cdpill,.rows.grow .bar i,.rows.grow .odds{animation:none}
  .bar i{transition:none}
}

function animateWheels(){
  document.querySelectorAll(".wheel-disc[data-spin]").forEach(el=>{
    const to=Number(el.dataset.to),elapsed=Number(el.dataset.el);
    if(elapsed>=SPIN_MS||!el.animate){el.style.transform=`rotate(${to}deg)`;return}
    const anim=el.animate([{transform:"rotate(0deg)"},{transform:`rotate(${to}deg)`}],{duration:SPIN_MS,delay:-elapsed,easing:"cubic-bezier(.05,.8,.25,1)",fill:"forwards"});
    if(S.mode==="host"&&SND.on)tickLoop(el,anim);
  });
  /* slot reels: each strip rolls down and stops on its symbol, left to right */
  document.querySelectorAll(".strip[data-reel]").forEach(el=>{
    const d=Number(el.dataset.dur),e=Number(el.dataset.el),from=el.dataset.from,to=el.dataset.to,mid=el.dataset.mid,Y=v=>`translateY(${v}%)`;
    if(e>=d||!el.animate){el.style.transform=Y(to);return}
    /* the teasing third reel keeps rolling at full speed until reel 2 stops, then slows down over its last five symbols */
    if(mid)el.animate([{transform:Y(from),easing:"linear"},{transform:Y(mid),offset:Number(el.dataset.midoff),easing:"cubic-bezier(.2,.6,.4,1)"},{transform:Y(to)}],{duration:d,delay:-e,fill:"forwards"});
    else el.animate([{transform:Y(from)},{transform:Y(to)}],{duration:d,delay:-e,easing:"cubic-bezier(.3,.7,.3,1)",fill:"forwards"});
  });
  /* roulette: wheel and ball turn in opposite directions, then the ball drops into its pocket */
  document.querySelectorAll("[data-rot]").forEach(el=>{
    const to=Number(el.dataset.rot),d=Number(el.dataset.dur),e=Number(el.dataset.el);
    if(e>=d||!el.animate){el.style.transform=`rotate(${to}deg)`;return}
    el.animate([{transform:"rotate(0deg)"},{transform:`rotate(${to}deg)`}],{duration:d,delay:-e,easing:"cubic-bezier(.12,.6,.2,1)",fill:"forwards"});
  });
  document.querySelectorAll("[data-drop]").forEach(el=>{
    const p=Number(el.dataset.drop),d=Number(el.dataset.dur),e=Number(el.dataset.el),T=(x,o)=>({transform:`translateY(${x.toFixed(2)}%)`,offset:o});
    if(e>=d||!el.animate){el.style.transform=`translateY(${p}%)`;return}
    el.animate([T(0,0),T(0,.6),T(p*1.12,.78),T(p*.9,.85),T(p,.92),T(p,1)],{duration:d,delay:-e,easing:"linear",fill:"forwards"});
  });
}
/* Click as each segment passes the pointer */
function tickLoop(el,anim){
  const step=360/WHEEL.length;let last=null,lastT=0;
  (function f(){
    if(!el.isConnected||anim.playState!=="running")return;
    const m=/matrix\(([^,]+),\s*([^,]+)/.exec(getComputedStyle(el).transform||"");
    if(m){
      const a=((Math.atan2(+m[2],+m[1])*180/Math.PI)%360+360)%360,seg=Math.floor(a/step);
      if(last!==null&&seg!==last){const now=performance.now();if(now-lastT>26){sfx.tick();lastT=now}}
      last=seg;
    }
    requestAnimationFrame(f);
  })();
}

/* ---------- countdown ---------- */
function timeLeft(g){const r=g&&g.round;if(!r||g.phase!=="betting"||!r.endsAt)return null;return Math.max(0,r.endsAt-now())}
function ringOff(g,tl){return (100.53*(1-Math.min(1,tl/((g.round.dur||30)*1000)))).toFixed(2)}
function timerHTML(g){
  const tl=timeLeft(g);if(tl===null)return "";const sec=Math.ceil(tl/1000);
  return `<div class="timer${sec<=5?" hurry":""}" data-cdwrap><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" class="tr-bg"/><circle cx="20" cy="20" r="16" class="tr-fg" data-cdring style="stroke-dashoffset:${ringOff(g,tl)}" transform="rotate(-90 20 20)"/></svg><div><b data-cd>${sec}</b><span>seconds left</span></div></div>`;
}
function cdPill(g){const tl=timeLeft(g);if(tl===null)return "";const sec=Math.ceil(tl/1000);return `<span class="cdpill${sec<=5?" hurry":""}" data-cdwrap><b data-cd>${sec}</b>s</span>`}
/* ---------- reveal drumroll ---------- */
/* Spotlight sweep: races over the trainees, slows down and lands on the answer */
function sweepPlan(g){
  const r=g.round,ts=trainees(g),n=Math.max(1,ts.length),ans=Math.max(0,ts.findIndex(t=>t.id===r.answer)),start=h32(r.k)%n,laps=n<=3?3:2;
  return {ts,n,start,steps:laps*n+((ans-start)%n+n)%n};
}
function drumInfo(g){
  const r=g.round,st=r&&S.revealStart[r.k];if(!st)return {done:true};
  const el=Date.now()-st;if(el>=SWEEP_MS)return {done:true};
  const p=sweepPlan(g),f=Math.min(1,el/(SWEEP_MS-SWEEP_HOLD)),step=Math.min(p.steps,Math.floor(p.steps*(1-(1-f)*(1-f))));
  return {done:false,step,id:p.ts[(p.start+step)%p.n].id,landed:f>=1};
}
let SWEEP_RAF=null;
function sweepLoop(){
  if(SWEEP_RAF)return;let last=null;
  const f=()=>{
    const g=S.game;if(!g||g.phase!=="revealed"){SWEEP_RAF=null;return}
    const di=drumInfo(g);if(di.done){SWEEP_RAF=null;return}
    document.querySelectorAll("[data-sw]").forEach(el=>el.classList.toggle("spot",el.dataset.sw===di.id));
    document.querySelectorAll("[data-swwrap]").forEach(el=>el.classList.toggle("landed",di.landed));
    if(di.step!==last){last=di.step;if(S.mode==="host")sfx.tick();else if(di.landed)buzz(40)}
    SWEEP_RAF=requestAnimationFrame(f);
  };
  SWEEP_RAF=requestAnimationFrame(f);
}
function noteReveal(prev,next){
  const r=next&&next.round;if(!r||next.phase!=="revealed"||r.k in S.revealStart)return;
  const live=!!prev&&prev.phase!=="revealed"&&!REDUCED;
  S.revealStart[r.k]=live?Date.now():0;
  if(!live)return;
  setTimeout(()=>{if(S.mode==="host"){sfx.reveal();S.fx.add("flash")}render()},SWEEP_MS+60);
}
/* One clock for the countdown and the drumroll */
setInterval(()=>{
  const g=S.game;if(!g)return;
  const tl=timeLeft(g);
  if(tl!==null){
    const sec=Math.ceil(tl/1000);
    document.querySelectorAll("[data-cd]").forEach(el=>{el.textContent=sec});
    document.querySelectorAll("[data-cdring]").forEach(el=>{el.style.strokeDashoffset=ringOff(g,tl)});
    document.querySelectorAll("[data-cdwrap]").forEach(el=>el.classList.toggle("hurry",sec<=5));
    if(sec!==S.cdSec){
      if(S.mode==="host"&&sec<=5&&sec>0)sfx.beep(sec);
      if(sec===0&&S.cdSec!==null&&S.cdSec>0){if(S.mode==="host")sfx.buzzer();else buzz(200);render()}
      S.cdSec=sec;
    }
    if(tl<=0&&S.mode==="host"&&S.autoClosed!==g.round.k&&!S.busy){S.autoClosed=g.round.k;run(closeBetting)}
  }else S.cdSec=null;
  if(g.phase==="revealed"){const st=drumInfo(g).done?"done":"sweep";if(st!==S.drumStep){S.drumStep=st;render()}checkStory()}
},250);

/* ---------- backstory vote ---------- */
function storyMax(g){const v=g&&g.storyMax;return Math.max(0,Math.floor(Number(v==null?5:v))||0)}
function storiesUsed(g){return rounds(g).filter(r=>r.storyTime).length}
function storyInfo(g){
  const r=g.round,max=storyMax(g),used=storiesUsed(g),online=onlineCount(),need=Math.max(1,Math.floor(online/2)+1);
  const vv=S.votesKey===(r&&r.k)?S.votes:{},votes=Object.keys(vv).filter(k=>vv[k]).length;
  const active=!!(r&&r.storyTime);
  const open=g.phase==="revealed"&&!active&&max>0&&used<max&&drumInfo(g).done;
  return {max,used,left:Math.max(0,max-used),online,need,votes,active,open,voted:!!vv[S.me.pid]};
}
/* Host: start story time as soon as a majority of the connected phones voted */
function checkStory(){
  if(S.mode!=="host"||S.busy)return;const g=S.game;if(!g||g.phase!=="revealed")return;
  const si=storyInfo(g);if(!si.open||si.votes<si.need||S.storyFired===g.round.k)return;
  S.storyFired=g.round.k;run(startStory);
}
async function startStory(){
  const g=clone(S.game);if(g.phase!=="revealed"||g.round.storyTime)return;
  if(storiesUsed(g)>=storyMax(g))return;
  g.round.storyTime=true;const rs=rounds(g),i=rs.findIndex(x=>x.k===g.round.k);if(i>=0)rs[i].storyTime=true;g.rounds=rs;
  await setGame(g);
}
function noteStory(prev,next){
  const r=next&&next.round;if(!r||next.phase!=="revealed"||!r.storyTime)return;
  const was=prev&&prev.round&&prev.round.k===r.k&&prev.round.storyTime;
  if(was||!prev)return;
  if(S.mode==="host")sfx.fanfare();else buzz([40,30,40,30,120]);

}
async function voteStory(){
  const g=S.game,r=g&&g.round;if(!r||g.phase!=="revealed")return;
  try{await withTimeout(FB.set(gpath(`votes/${r.k}/${S.me.pid}`),true),12000);buzz(30)}catch(e){toast(errMsg(e))}
}
function storyMeter(g){
  const si=storyInfo(g);if(si.max<=0||si.active)return "";
  if(si.left<=0)return `<div class="svote off"><span class="svl">All ${si.max} backstories used</span></div>`;
  if(!si.open)return "";
  const pct=Math.min(100,Math.round(si.votes/si.need*100));
  return `<div class="svote"><span class="svl">Backstory? Vote on your phone</span><div class="svbar"><i style="width:${pct}%"></i></div><b>${si.votes}/${si.need}</b><span class="svs">${si.left} of ${si.max} left</span></div>`;
}

/* ---------- confetti + flash ---------- */
function confetti(){
  if(REDUCED)return;
  const c=document.createElement("canvas");c.className="confetti";c.setAttribute("aria-hidden","true");document.body.appendChild(c);
  const dpr=window.devicePixelRatio||1,ctx=c.getContext("2d"),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;
  const cols=["#2dff6e","#ff2d95","#ffe014","#18e0ff","#ff8a1f","#a35cff","#ffffff"];
  const P=Array.from({length:220},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*11*dpr,vy:-(6+Math.random()*8)*dpr,s:(5+Math.random()*8)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.16*dpr;p.vx*=.985;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}
    if(t-t0<5200)requestAnimationFrame(f);else c.remove()})(t0);
}
function flashbang(){if(REDUCED)return;const d=document.createElement("div");d.className="flashbang";d.setAttribute("aria-hidden","true");document.body.appendChild(d);setTimeout(()=>d.remove(),650)}
function fxOnce(id,kind){if(!S.seen.has(id)){S.seen.add(id);S.fx.add(kind||"confetti")}}

    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x+m} ${y+m}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" role="img" aria-label="QR code to join the game"><rect width="${s}" height="${s}" fill="#ffffff"/><path d="${d}" fill="#000000"/></svg>`;
  }catch(e){return ""}
}

/* ---------- subscriptions ---------- */
function onDbError(e){S.problem=isPerm(e)?"rules":"unreachable";render()}
function hostCues(prev,next){
  if(S.mode!=="host"||!prev||!next||prev.phase===next.phase)return;
  if(next.phase==="betting")sfx.open();

function subscribeGame(){
  if(!S.code||S.gameSub===S.code)return;

  const t=setTimeout(()=>{if(S.game===undefined){S.stale=true;render()}},10000);
  FB.on(gpath("state"),v=>{
    clearTimeout(t);S.stale=false;
    const prev=S.game;S.game=v||null;noteSpin(prev,S.game);noteReveal(prev,S.game);noteStory(prev,S.game);hostCues(prev,S.game);
    const rk=S.game&&S.game.phase==="betting"&&S.game.round?S.game.round.k:null;
    if(rk!==S.betsKey){
      if(S.unsub.bets)S.unsub.bets();S.unsub.bets=null;S.bets={};S.betsKey=rk;S.betCount=0;
      if(rk)S.unsub.bets=FB.on(gpath("bets/"+rk),b=>{
        if(S.betsKey!==rk)return;S.bets=b||{};
        const n=Object.keys(S.bets).length;if(n>S.betCount)sfx.coin();S.betCount=n;
        render();
      },onDbError);
    }
    const vk=S.game&&S.game.phase==="revealed"&&S.game.round?S.game.round.k:null;
    if(vk!==S.votesKey){
      if(S.unsub.votes)S.unsub.votes();S.unsub.votes=null;S.votes={};S.votesKey=vk;
      if(vk)S.unsub.votes=FB.on(gpath("votes/"+vk),v=>{if(S.votesKey!==vk)return;S.votes=v||{};render();checkStory()},onDbError);
    }
    const sg=S.game,sk=sg&&sg.phase==="locked"&&sg.wheel&&sg.round&&devOf(sg.round)==="roul"&&!sg.round.spin?sg.round.k:null;
    if(sk!==S.sideKey){
      if(S.unsub.side)S.unsub.side();S.unsub.side=null;S.side={};S.sideKey=sk;
      if(sk)S.unsub.side=FB.on(gpath("side/"+sk),v=>{if(S.sideKey!==sk)return;S.side=v||{};render()},onDbError);
    }
    if(S.view===null)S.view=S.mode==="host"?(S.game?"board":"setup"):"play";
    render();
  },e=>{clearTimeout(t);onDbError(e)});
  FB.on(gpath("photos"),v=>{const o={};for(const [k,p] of Object.entries(v||{}))if(okPhoto(p))o[k]=p;S.photos=o;render()},()=>{});
  FB.on(gpath("players"),v=>{
    S.players=v||{};

/* ---------- toast + confirm + copy ---------- */
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(S.toastT);S.toastT=setTimeout(()=>{t.hidden=true},3600)}
function armed(name){
  if(S.confirm===name){S.confirm=null;clearTimeout(S.confirmT);return true}
  S.confirm=name;clearTimeout(S.confirmT);
  S.confirmT=setTimeout(()=>{S.confirm=null;S.lastKey=null;render()},4000);
  S.lastKey=null;render();return false;
}
function copyText(text,okMsg){
  const done=()=>toast(okMsg||"Copied");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();ok?done():toast("Couldn't copy. Select the text and copy it yourself.")};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);else fallback();
}

/* ---------- screens ---------- */
function screenKey(){
  if(S.problem)return "problem-"+S.problem;
  if(S.mode==="landing")return "landing";
  if(S.mode==="host"){
    if(S.host===undefined)return "boot";
    if(S.view==="setup"||(!S.code&&S.view!=="board"))return "setup";
    if(S.code&&S.game===undefined)return "boot";
    return "board";
  }
  if(!S.code)return "landing";
  if(S.game===undefined)return "boot";
  if(!S.me.nick)return "join";
  return "slip";
}
const STATIC=new Set(["setup","join","landing"]);

function render(){
  const key=screenKey();
  applyLook(key);
  renderChrome(key);
  if(STATIC.has(key)&&key===S.lastKey)return;
  const first=key!==S.lastKey;S.lastKey=key;
  if(key==="setup"&&!S.draft)S.draft=S.host&&S.host.setup?normalizeSetup(clone(S.host.setup)):defaultDraft();
  $("#main").innerHTML=build(key);
  animateWheels();
  if(S.game&&S.game.phase==="revealed"&&!drumInfo(S.game).done)sweepLoop();
  if(S.fx.has("flash"))flashbang();
  if(S.fx.has("confetti"))confetti();
  S.fx.clear();
  if(first&&key==="join"){const n=$("#nick");if(n)n.focus({preventScroll:true})}
}
function build(key){
  switch(key){
    case "problem-rules":return rulesCard();

    case "boot":return msgCard("Warming up the stage…",S.stale?"This is taking longer than usual. Check your connection; the board appears as soon as it loads.":"The live board loads in a moment.");
    case "landing":return landingHTML();
    case "setup":return setupHTML();

}

function toteHTML(g,bets,ans,rowCls,extraHead){

function multLabel(m){return m>=20?"Jackpot! House money × 20":m>=10?"Mega bonus! House money × 10":m>1?`House money × ${m}`:"No bonus this round"}
function boardRace(g){
  const r=g.round,bets=liveBets(),ans=g.phase==="revealed"?r.answer:null,m=r.mult||1;

  if(g.phase==="locked"&&g.wheel&&devOf(r)!=="wheel"){

    return `<section>${head}<h2 class="statement sm${long}">${esc(r.text)}</h2>
      <div class="lockgrid"><div class="wheelbox">${wheelHTML(r,"big")}<div class="wheelover">${over}</div></div><div class="min0">${toteHTML(g,bets,null)}</div></div></section>`;

      ?`<p class="verdict">${winners.length} ${winners.length===1?"player":"players"} split the <b>${fmt(st.pot)}</b> pot${m>1?` (house money <b>× ${m}</b>)`:""}.</p><div class="payouts${first?" popin":""}">${winners.map(([k,n])=>`<span class="chip">${esc(nickOf(k))} <span class="plus">${signed(n)}</span></span>`).join("")}</div>`
      :`<p class="verdict">Nobody picked ${esc(wt.name)}. The house keeps the <b>${fmt(st.pot)}</b> pot.</p>`;
    const story=r.story?`<div class="story"><p class="t">${esc(r.story)}</p></div>`:"";
    const headV=head.replace(/<\/div>$/,storyMeter(g)+"</div>");
    return `<section>${headV}<h2 class="statement sm${long}">${esc(r.text)}</h2>
      <div class="resultgrid"><div class="resultcard"><p class="eyebrow">It was</p><div class="itwas">${face(wt,"xl")}<b>${esc(wt.name)}</b></div>${story}${verdict}</div><div class="min0">${toteHTML(g,bets,ans)}</div></div></section>`;

}
function ladderGrid(st,showD,avail,maxRows){

function validate(d){
  const ts=d.trainees.map(t=>{const o={id:t.id,name:cleanNick(t.name)};if(okPhoto(t.photo))o.photo=t.photo;if(okPhoto(t.photoL))o.photoL=t.photoL;return o}).filter(t=>t.name);
  if(ts.length<2)return {err:"Add at least two trainees."};
  const ids=new Set(ts.map(t=>t.id));
  const list=d.statements.map((s,i)=>({id:s.id,text:clean(s.text,160),answer:s.answer||"",story:clean(s.story||"",140),i}));
  const statements=list.filter(s=>s.text);
  if(!statements.length)return {err:"Add at least one statement."};
  const miss=statements.find(s=>!ids.has(s.answer));
  if(miss)return {err:`Statement ${miss.i+1} needs an answer. Pick who it's about.`};
  return {ok:{title:clean(d.title,40)||"The Trainee Stakes",cur:clean(d.cur,3)||"€",
    start:Math.max(10,Math.floor(Number(d.start))||1000),seed:Math.max(0,Math.floor(Number(d.seed))||0),
    wheel:d.wheel!==false,payer:cleanNick(d.payer),theme:lookOk(d.theme)?d.theme:LOOKS[0][0],
    timer:Math.min(300,Math.max(0,Math.floor(Number(d.timer))||0)),comeback:Math.max(0,Math.floor(Number(d.comeback))||0),live:!!d.live,
    storyMax:Math.min(30,Math.max(0,Math.floor(Number(d.storyMax))||0)),
    trainees:ts,statements:statements.map(({id,text,answer,story})=>({id,text,answer,story}))}};
}

/* Photo upload. Crop a square around the face, shrink in halves (sharpest way a browser can resize),
   then a light "sharpen for screen" pass, like photo apps do when exporting.
   Two copies: 1400 px for the big screen (host only) and 720 px for the phones. */
function shrink(src,size){
  let cur=src,w=src.width;
  while(w/2>=size){const h=Math.round(w/2),c=document.createElement("canvas");c.width=c.height=h;const x=c.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(cur,0,0,w,w,0,0,h,h);cur=c;w=h}
  const out=document.createElement("canvas");out.width=out.height=size;const o=out.getContext("2d",{willReadFrequently:true});o.imageSmoothingEnabled=true;o.imageSmoothingQuality="high";o.drawImage(cur,0,0,w,w,0,0,size,size);
  return out;
}
/* Unsharp mask: sharpened = original + amount × (original − blurred). Threshold keeps flat skin and noise smooth.
   radius 2 is used for the big copy, because the screen shows it a bit smaller than it is stored. */
function sharpen(cv,amount,threshold,radius){
  const w=cv.width,h=cv.height,ctx=cv.getContext("2d",{willReadFrequently:true}),id=ctx.getImageData(0,0,w,h),d=id.data,n=w*h;
  const K=radius===2?[1/16,4/16,6/16,4/16,1/16]:[.25,.5,.25],R=K.length>>1,tmp=new Float32Array(n*3),blur=new Float32Array(n*3);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;for(let c=0;c<3;c++){let v=0;for(let k=-R;k<=R;k++){const xx=x+k<0?0:x+k>=w?w-1:x+k;v+=K[k+R]*d[(y*w+xx)*4+c]}tmp[i*3+c]=v}}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;for(let c=0;c<3;c++){let v=0;for(let k=-R;k<=R;k++){const yy=y+k<0?0:y+k>=h?h-1:y+k;v+=K[k+R]*tmp[(yy*w+x)*3+c]}blur[i*3+c]=v}}
  for(let i=0;i<n;i++)for(let c=0;c<3;c++){const o=d[i*4+c],diff=o-blur[i*3+c];if(Math.abs(diff)>threshold){const v=o+amount*diff;d[i*4+c]=v<0?0:v>255?255:v}}
  ctx.putImageData(id,0,0);return cv;
}
let WEBP=null;
function canWebP(){if(WEBP===null){try{const c=document.createElement("canvas");c.width=c.height=2;WEBP=c.toDataURL("image/webp",.9).startsWith("data:image/webp")}catch(e){WEBP=false}}return WEBP}
function encode(cv,q){return canWebP()?cv.toDataURL("image/webp",q):cv.toDataURL("image/jpeg",Math.min(.95,q+.02))}
async function loadPhoto(id,file){
  try{
    toast("Preparing the photo…");
    const url=URL.createObjectURL(file),img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    const W=img.naturalWidth,H=img.naturalHeight,n=Math.min(W,H),sx=(W-n)/2,sy=H>W?(H-n)*.3:(H-n)/2;
    const m=Math.min(n,2800),base=document.createElement("canvas");base.width=base.height=m;
    const bx=base.getContext("2d");bx.imageSmoothingEnabled=true;bx.imageSmoothingQuality="high";bx.drawImage(img,sx,sy,n,n,0,0,m,m);

    await new Promise(r=>setTimeout(r,30));
    t.photoL=encode(sharpen(shrink(base,Math.min(1400,m)),1,3,2),.92);

    toast(n<800?`Photo added, but it's only ${n} px wide, so it can look soft on the big screen. A bigger photo works better. Save the setup to keep it.`:"Photo added. Save the setup to keep it.");
  }catch(e){toast("Couldn't read that image. Try a JPG or PNG.")}
}
